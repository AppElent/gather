name: CI
# Pull requests, plus deploy.yml's `checks` job, which calls this workflow before
# it deploys anything that lands on main — so a push trigger would only
# duplicate that run.
on:
  pull_request:
  workflow_call:
# A new push cancels a PR's stale run. A call from deploy.yml gets its own group,
# so a production deploy's checks never cancel a staging deploy's.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      # Manifest-only: internal consistency plus a stale .env.example. Needs no
      # credentials, so it runs on every PR including one from a fork.
      - run: pnpm run env:check
      # Toolkit conformance (docs/standards/baseline.md): fails on any warning, so
      # new drift blocks the PR.
      - run: node scripts/check-project.mjs --strict
      - run: pnpm run typecheck
      # apps/mobile has its own tsconfig (React Native types, Expo Router); the
      # root `tsc` run above does not use it. Its tests already run under the
      # `mobile` project of the root vitest config, so `pnpm test` covers those.
      - run: pnpm --filter @gather/mobile typecheck
      - run: pnpm test
      # Build catches bundling/plugin/SSR-compile breakage that typecheck + tests
      # miss. preview.yml builds only for labelled PRs, so this keeps the build
      # signal on every PR. No SENTRY_AUTH_TOKEN: a check build uploads no maps.
      - run: pnpm build
