name: CI
# pull_request only. Anything landing on main is gated by deploy.yml's `checks`
# job, which runs the same suite before it deploys — so a push trigger here would
# only duplicate that run.
on:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Configure GitHub Packages auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
        run: echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run typecheck
      - run: pnpm test
      # Build catches bundling/plugin/SSR-compile breakage that typecheck + tests
      # miss. preview.yml builds too, but only when its secrets are present — this
      # keeps the build signal on every PR regardless.
      - run: pnpm build
