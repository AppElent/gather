# From the toolkit template docs/standards/mobile-baseline/templates/mobile-runtime.yml
# (Mobile distribution standard). Gather additions: `packages/**` in the paths,
# because @gather/core is bundled into the app and a workspace package can carry
# native config; and the work split into two jobs, so the job that installs and
# runs PR code holds a read-only token and only the comment job can write.
name: Mobile runtime

# Says on each PR whether it changes the app's native runtime fingerprint
# (ADR 0029). If it does, installed builds can't load the PR as an over-the-air
# update and a new build is due after merging; if not,
# `pnpm mobile:update:preview` ships it. Informational: it never fails a PR for
# changing native code. Needs no EAS login and no secrets.
on:
  pull_request:
    paths:
      - apps/mobile/**
      - packages/**
      - patches/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/mobile-runtime.yml

permissions: {}

concurrency:
  group: mobile-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      # The default pull_request checkout is the PR merged into the base tip, so
      # comparing it with the base tip answers "does merging this change the
      # fingerprint" without counting native changes that landed on main since
      # the branch point.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      # Native modules are fingerprinted from node_modules, so both sides need
      # their own install. The second one comes from the pnpm store.
      - run: pnpm install --frozen-lockfile
      # A base without the app needs no install; fingerprint.mjs says so.
      - name: Install base
        run: |
          if [ -f .base/apps/mobile/package.json ]; then
            cd .base && pnpm install --frozen-lockfile --prefer-offline
          fi

      - name: Compare fingerprints
        run: |
          node apps/mobile/scripts/fingerprint.mjs diff .base > "$RUNNER_TEMP/runtime.md"
          cat "$RUNNER_TEMP/runtime.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-runtime
          path: ${{ runner.temp }}/runtime.md
          if-no-files-found: error
          retention-days: 1

  # Runs no PR code: it only turns the Markdown above into one sticky comment.
  # Dependabot's token takes the write permission below, so its dependency bumps,
  # the likeliest native changes, get the comment too. A fork's token stays
  # read-only whatever this asks, so forks skip it; the summary still has it.
  comment:
    needs: fingerprint
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions: { pull-requests: write }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mobile-runtime
          path: ${{ runner.temp }}/mobile-runtime
      - name: Upsert PR comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- mobile-runtime -->';
            const body = `${marker}\n${fs.readFileSync(`${process.env.RUNNER_TEMP}/mobile-runtime/runtime.md`, 'utf8')}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find((c) => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
