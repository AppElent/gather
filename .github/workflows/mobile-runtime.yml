# From the toolkit template docs/standards/mobile-baseline/templates/mobile-runtime.yml
# (Mobile distribution standard). Gather additions: `packages/**` in the paths,
# because @gather/core is bundled into the app and a workspace package can carry
# native config; and the comment job's token limited to this workflow.
name: Mobile runtime

# Says on each PR whether it changes the app's native runtime fingerprint
# (ADR 0029). If it does, installed builds can't load the PR as an over-the-air
# update and a new build is due after merging; if not,
# `pnpm mobile:update:preview` ships it. Informational: it never fails a PR for
# changing native code. Needs no EAS login and no secrets.
on:
  pull_request:
    paths:
      - apps/mobile/**
      - packages/**
      - patches/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/mobile-runtime.yml

permissions: {}

concurrency:
  group: mobile-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The default pull_request checkout is the PR merged into the base tip, so
      # comparing it with the base tip answers "does merging this change the
      # fingerprint" without counting native changes that landed on main since
      # the branch point.
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # Native modules are fingerprinted from node_modules, so both sides need
      # their own install. The second one comes from the pnpm store.
      - run: pnpm install --frozen-lockfile
      # A base without the app needs no install; fingerprint.mjs says so.
      - name: Install base
        run: |
          if [ -f .base/apps/mobile/package.json ]; then
            cd .base && pnpm install --frozen-lockfile --prefer-offline
          fi

      - name: Compare fingerprints
        run: |
          node apps/mobile/scripts/fingerprint.mjs diff .base > "$RUNNER_TEMP/runtime.md"
          cat "$RUNNER_TEMP/runtime.md" >> "$GITHUB_STEP_SUMMARY"

      # Dependabot and fork runs get a read-only token; the summary still has it.
      - name: Upsert PR comment
        if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- mobile-runtime -->';
            const body = `${marker}\n${fs.readFileSync(`${process.env.RUNNER_TEMP}/runtime.md`, 'utf8')}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
