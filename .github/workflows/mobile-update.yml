name: Mobile update (preview)

# Publishes the app's JavaScript to the `preview` update channel, the one the
# owner's daily-driver build (`preview-internal`) follows (the release
# standard, ADR 0044). deploy.yml calls it after the production deploy:
# preview builds call production Convex, so the update must not land before
# the functions it calls.
#
# apps/mobile/scripts/ota-gate.mjs decides per platform: skipped when nothing
# the app bundles changed since that platform's `ota-preview-<platform>` tag, and skipped with "rebuild
# preview-internal" in the run summary when no update or build on the channel
# has this runtime fingerprint (a native change is waiting for a build).
#
# A local build (`eas build --local`) is not recorded on EAS until it is
# uploaded: `pnpm exec eas upload -p <platform> --build-path <file>` registers
# its fingerprint, which the gate also accepts. Without the upload, run this
# workflow by hand with `force` to seed the channel.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      force:
        description: Publish even when nothing changed or no build on the channel has this fingerprint
        type: boolean
        default: false

concurrency:
  group: mobile-update-preview
  cancel-in-progress: false

jobs:
  publish:
    # Preview builds call production Convex, which only main deploys.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Moves the ota-preview tags.
      contents: write
    # An Expo token is account-wide: it could publish to any channel. It lives
    # only in the production Environment, which deploys from main only, never
    # in repository scope where any branch's workflow could read it.
    environment: production
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      VITE_SENTRY_ORG: ${{ vars.VITE_SENTRY_ORG }}
      VITE_SENTRY_PROJECT: ${{ vars.VITE_SENTRY_PROJECT }}
      FORCE: ${{ inputs.force && '--force' || '' }}
      # Android is paused until this repository variable is `true`
      # (developer-home standards/releases.md, "Android pause").
      ANDROID_ENABLED: ${{ vars.ANDROID_ENABLED }}
    steps:
      # Web has already shipped by now, so a missing token warns rather than
      # turning the Deploy run red. The production update job never selects a
      # run whose Publish step did not run.
      - name: Check Expo token
        id: token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::warning::EXPO_TOKEN is not set in the production Environment; no preview update published. Store expo-token in Infisical and run pnpm env:apply production --only github."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # The gate diffs against the ota-preview tags, so it needs history and tags.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.token.outputs.ok == 'true'
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: steps.token.outputs.ok == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.token.outputs.ok == 'true'
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
        if: steps.token.outputs.ok == 'true'

      - name: Gate
        id: gate
        if: steps.token.outputs.ok == 'true'
        run: node apps/mobile/scripts/ota-gate.mjs preview $FORCE

      # The wrapper pairs --channel with --environment (EXPO_PUBLIC_* come from
      # the EAS `preview` environment) and uploads the update's source maps.
      - name: Publish
        if: steps.token.outputs.ok == 'true' && steps.gate.outputs.platforms != ''
        run: |
          published=0
          for platform in ${{ steps.gate.outputs.platforms }}; do
            node apps/mobile/scripts/publish-update.mjs preview \
              --platform "$platform" --non-interactive
            # Per platform, so publishing one never marks the other as current.
            git tag -f "ota-preview-$platform"
            git push -f origin "refs/tags/ota-preview-$platform"
            published=$((published + 1))
          done
          # The channel tag means "every enabled platform runs at least this commit".
          if [ "$published" -eq "$([ "$ANDROID_ENABLED" = true ] && echo 2 || echo 1)" ]; then
            git tag -f ota-preview
            git push -f origin refs/tags/ota-preview
          fi
