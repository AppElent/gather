name: PR Preview

# Adapted from docs/standards/previews/templates/preview.yml.
# Opt-in: deploys only while the PR carries the `preview:web` label; pushes
# redeploy, and removing the label or closing the PR deletes the Worker. Close
# always cleans up, so Workers deployed before the label gate are not left behind.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]

jobs:
  deploy:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview:web') &&
      github.event.action != 'closed' && github.event.action != 'unlabeled' &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview:web')
    # Job-level so a fully skipped run (an unrelated label) cannot cancel a deploy.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    env:
      WORKER_NAME: gather-pr-${{ github.event.pull_request.number }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # This job declares no `environment:`, so every value comes from repository
      # scope, where `pnpm env:apply preview` writes it as PREVIEW_<name>. The
      # prefix keeps preview values from ever standing in for a missing
      # `staging` or `production` Environment value (environments.md).
      # Secret entries come from `secrets.`, public ones from `vars.`.
      CLOUDFLARE_API_TOKEN: ${{ secrets.PREVIEW_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.PREVIEW_CLOUDFLARE_ACCOUNT_ID }}
      CONVEX_DEPLOY_KEY: ${{ secrets.PREVIEW_CONVEX_DEPLOY_KEY }}
      SENTRY_AUTH_TOKEN: ${{ secrets.PREVIEW_SENTRY_AUTH_TOKEN }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.PREVIEW_VITE_CLERK_PUBLISHABLE_KEY }}
      VITE_ENABLE_SAMPLE_DATA: ${{ vars.PREVIEW_VITE_ENABLE_SAMPLE_DATA }}
      VITE_SENTRY_DSN: ${{ vars.PREVIEW_VITE_SENTRY_DSN }}
      VITE_SENTRY_ORG: ${{ vars.PREVIEW_VITE_SENTRY_ORG }}
      VITE_SENTRY_PROJECT: ${{ vars.PREVIEW_VITE_SENTRY_PROJECT }}
      # The Cloudflare Vite plugin picks the wrangler env at build time. `pr`
      # clears routes, so a preview never claims a custom domain.
      CLOUDFLARE_ENV: pr
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Convex provisions/refreshes preview backend pr-<N>, exposes its URL as
      # $CONVEX_URL inside --cmd, then runs the build (bridge CONVEX_URL ->
      # VITE_CONVEX_URL since the app reads the Vite-prefixed var at build
      # time). Every other VITE_* is already on the job env.
      #
      # --preview-run seeds the fresh backend: seed:seedPreview reconciles the
      # Tasting catalog and rebuilds the Sample household. It is ignored on
      # production deploys by design, so this line can never fire against prod.
      - name: Convex preview deploy + build
        run: |
          pnpm exec convex deploy \
            --preview-create pr-${{ github.event.pull_request.number }} \
            --preview-run seed:seedPreview \
            --cmd-url-env-var-name CONVEX_URL \
            --cmd 'VITE_CONVEX_URL=$CONVEX_URL pnpm build'

      - name: Deploy Worker (per-PR)
        id: deploy
        run: |
          set -o pipefail
          pnpm exec wrangler deploy --name "$WORKER_NAME" 2>&1 | tee "$RUNNER_TEMP/wrangler-deploy.log"
          URL=$(grep -oE 'https://[^ ]+workers\.dev' "$RUNNER_TEMP/wrangler-deploy.log" | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # A per-PR Worker starts with no secrets. The manifest lands the issue
      # reporter's values on the preview Worker and on `workflow`, so they are
      # here as PREVIEW_<name>; GITHUB_REPOSITORY_OWNER is the runner's own.
      # Runs after the deploy because a Worker must exist before it can hold a
      # secret. `apply` skips anything it has no value for, so the reporter just
      # stays off when a value is missing.
      - name: Apply Worker runtime values
        env:
          GITHUB_ISSUES_TOKEN: ${{ secrets.PREVIEW_GITHUB_ISSUES_TOKEN }}
          GITHUB_REPOSITORY_NAME: ${{ vars.PREVIEW_GITHUB_REPOSITORY_NAME }}
        run: node scripts/env.mjs apply preview --ci --only worker --pr "$PR_NUMBER"

      # A preview that inherits production routes takes over the production domain.
      - name: Guard against custom domains
        run: |
          if grep -qi 'custom domain' "$RUNNER_TEMP/wrangler-deploy.log"; then
            echo "::error::The preview Worker claimed a custom domain. Redeploy production, then fix the wrangler pr env."
            exit 1
          fi

      - name: Upsert PR comment
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
        with:
          script: |
            const marker = '<!-- pr-preview-comment -->';
            const body = `${marker}\n### Preview\n- App: ${process.env.URL}\n- Convex preview: \`pr-${process.env.PR}\``;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'preview:web'))
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.PREVIEW_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.PREVIEW_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Delete Worker
        run: pnpm exec wrangler delete --force --name "gather-pr-${{ github.event.pull_request.number }}" || true
      # Convex preview deployments idle-expire automatically (~14 days).
      # No reliable CLI delete today; prune from the dashboard if needed.
