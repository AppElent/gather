name: Deploy

# Merge to main -> stg. Manual "Run workflow" -> production. There is no
# deployed dev environment: dev is `pnpm dev` against your own convex dev
# deployment, which is why nothing here can push schema out from under it.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a deploy mid-flight; queue behind the previous one instead.
concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && 'production' || 'stg' }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Configure GitHub Packages auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
        run: echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run env:check
      - run: pnpm run typecheck
      - run: pnpm test
      # No `pnpm build` here — the deploy job builds for real a few minutes later,
      # and a build-only failure there fails the workflow just as loudly.

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    # push to main -> stg; manual Run workflow -> production.
    environment: ${{ github.event_name == 'workflow_dispatch' && 'production' || 'stg' }}
    permissions: { contents: read, packages: read }
    env:
      # Every value below is environment-scoped: the `stg` and `production`
      # GitHub Environments hold their own copies, so this file names each once
      # and never selects between them.
      #
      # It used to. `WRANGLER_ARGS`, `VITE_ENABLE_SAMPLE_DATA` and the two test
      # credentials were `github.event_name` ternaries, each carrying a comment
      # about GitHub's empty-string falsiness — including one warning that the
      # opposite polarity "would evaluate to 'true' on *production*, which is the
      # one thing it must not do". Those were per-environment values written as
      # expressions. They are now per-environment values, and the absence of a
      # value on `production` is what keeps it off production.
      #
      # Which of these exist in which environment is declared in env.manifest.ts
      # and verified by the `Check environment` step below, before anything ships.
      ENVIRONMENT_NAME: ${{ github.event_name == 'workflow_dispatch' && 'production' || 'stg' }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      # Public values are GitHub *variables*, not secrets — masking a value the
      # build inlines into a downloadable bundle only makes the logs harder to
      # read. It also lets `env:check` compare them against the committed
      # env/<environment>.public.env, which is the one value-diff a secret store
      # can never support.
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
      VITE_ENABLE_SAMPLE_DATA: ${{ vars.VITE_ENABLE_SAMPLE_DATA }}
      VITE_TEST_USER_EMAIL: ${{ vars.VITE_TEST_USER_EMAIL }}
      VITE_TEST_USER_PASSWORD: ${{ vars.VITE_TEST_USER_PASSWORD }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      VITE_SENTRY_ORG: ${{ vars.VITE_SENTRY_ORG }}
      VITE_SENTRY_PROJECT: ${{ vars.VITE_SENTRY_PROJECT }}
      # wrangler.jsonc: top-level = `gather` (prod), env.stg = `gather-stg`.
      WRANGLER_ARGS: ${{ github.event_name == 'workflow_dispatch' && ' ' || '--env stg' }}
    steps:
      # workflow_dispatch lets the operator pick any branch in the UI. Production
      # ships from main only; fail loudly rather than skipping silently.
      - name: Guard production ref
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production deploys must run from main (got ${GITHUB_REF})."
          exit 1

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      # @appelent/* is a private GitHub Packages scope. pnpm won't expand env vars
      # from the committed .npmrc, so write the token to the runner's ~/.npmrc.
      - name: Configure GitHub Packages auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
        run: echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc

      - run: pnpm install --frozen-lockfile

      # Fails the deploy rather than shipping a half-configured environment.
      # `--ci` checks the job env instead of calling APIs: a workflow cannot list
      # GitHub secrets (GITHUB_TOKEN cannot be granted secrets:read) and does not
      # need to, because it holds them. This is what catches the hazard ADR 0013
      # names — "the staging deployment inherits nothing" — before a merge ships
      # a staging site nobody can sign into.
      - name: Check environment
        run: node scripts/env.mjs check "$ENVIRONMENT_NAME" --ci

      # CONVEX_DEPLOY_KEY alone picks the target deployment — a deploy key scopes
      # every convex command to it. Convex exposes that deployment's URL to --cmd
      # as $CONVEX_URL; bridge it to VITE_CONVEX_URL, which is what the app reads
      # at build time. Every other VITE_* is already on the job env, and Vite
      # picks prefixed vars up from process.env.
      #
      # Both targets run `pnpm build`, not build:development — staging exists to
      # exercise the same bundle production ships. What differs between them is
      # env vars, not build mode.
      - name: Convex deploy + build
        run: |
          pnpm exec convex deploy \
            --cmd-url-env-var-name CONVEX_URL \
            --cmd "VITE_CONVEX_URL=\$CONVEX_URL pnpm build"

      # Convex has no post-deploy hook outside previews, so the Catalog seed is a
      # separate step. Runs before the Worker flips, so the backend is complete by
      # the time anyone can reach the new frontend.
      - name: Seed Catalog
        run: pnpm exec convex run seed:seedCatalog

      - name: Deploy Worker
        run: pnpm exec wrangler deploy $WRANGLER_ARGS
