name: Deploy

# Merge to main -> stg. Manual "Run workflow" -> production. There is no
# deployed dev environment: dev is `pnpm dev` against your own convex dev
# deployment, which is why nothing here can push schema out from under it.
#
# stg is a frontend on the production Convex deployment (ADR 0039): a merge ships
# the gather-stg Worker and nothing else. Backend changes ship on the click.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a deploy mid-flight; queue behind the previous one instead.
concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && 'production' || 'stg' }}
  cancel-in-progress: false

jobs:
  # The same suite as pull requests, because admins can bypass required checks.
  # Called without `secrets: inherit`, so its build uploads no source maps.
  checks:
    uses: ./.github/workflows/ci.yml
    permissions: { contents: read }

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    # push to main -> stg; manual Run workflow -> production.
    environment: ${{ github.event_name == 'workflow_dispatch' && 'production' || 'stg' }}
    permissions: { contents: read }
    env:
      # Every secret and variable below is environment-scoped: the `stg` and
      # `production` GitHub Environments hold their own copies, so this file
      # names each once and never selects between them. Which of them exist in
      # which environment is declared in env.manifest.ts and verified by the
      # `Check environment` step below, before anything ships.
      ENVIRONMENT_NAME: ${{ github.event_name == 'workflow_dispatch' && 'production' || 'stg' }}
      # Production only. A stg job also inherits any repo secret of this name, so
      # withholding it here is what stops a merge changing the backend (ADR 0039).
      CONVEX_DEPLOY_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.CONVEX_DEPLOY_KEY || '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      # Public values are GitHub *variables*, not secrets: the build inlines
      # them into a downloadable bundle.
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
      VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
      VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
      VITE_SENTRY_ORG: ${{ vars.VITE_SENTRY_ORG }}
      VITE_SENTRY_PROJECT: ${{ vars.VITE_SENTRY_PROJECT }}
      # wrangler.jsonc: top-level = `gather` (prod), env.stg = `gather-stg`. The
      # Cloudflare Vite plugin picks the Worker at build time from CLOUDFLARE_ENV
      # and writes it to dist/server/wrangler.json; `wrangler deploy --env` is
      # ignored after such a build. Written `!= … && 'stg' || ''` because the
      # other polarity would make production's empty string fall through to 'stg'.
      CLOUDFLARE_ENV: ${{ github.event_name != 'workflow_dispatch' && 'stg' || '' }}
      WORKER_NAME: ${{ github.event_name != 'workflow_dispatch' && 'gather-stg' || 'gather' }}
    steps:
      # workflow_dispatch lets the operator pick any branch in the UI. Production
      # ships from main only; fail loudly rather than skipping silently.
      - name: Guard production ref
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production deploys must run from main (got ${GITHUB_REF})."
          exit 1

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      # Fails the deploy rather than shipping a half-configured environment. An
      # Environment without its own CONVEX_DEPLOY_KEY silently inherits the repo
      # one, so production checks the prefix first. `--ci` checks the job env instead of calling APIs: a workflow cannot list
      # GitHub secrets and does not need to, because it holds them.
      - name: Check environment
        run: |
          if [ "$ENVIRONMENT_NAME" = production ]; then
            case "$CONVEX_DEPLOY_KEY" in
              prod:*) ;;
              *) echo "::error::CONVEX_DEPLOY_KEY in the production Environment is missing or not a prod: key."; exit 1 ;;
            esac
          fi
          node scripts/env.mjs check "$ENVIRONMENT_NAME" --ci

      # CONVEX_DEPLOY_KEY alone picks the target deployment. Convex exposes that
      # deployment's URL to --cmd as $CONVEX_URL; bridge it to VITE_CONVEX_URL,
      # which is what the app reads at build time. Every other VITE_* is already
      # on the job env, and Vite picks prefixed vars up from process.env.
      #
      # Both targets run `pnpm build`, not build:development — staging exists to
      # exercise the same bundle production ships.
      - name: Convex deploy + build
        if: github.event_name == 'workflow_dispatch'
        run: |
          pnpm exec convex deploy \
            --cmd-url-env-var-name CONVEX_URL \
            --cmd "VITE_CONVEX_URL=\$CONVEX_URL pnpm build"

      # Convex has no post-deploy hook outside previews, so the Catalog seeds are
      # separate steps. Runs before the Worker flips, so the backend is complete by
      # the time anyone can reach the new frontend.
      - name: Seed Catalog
        if: github.event_name == 'workflow_dispatch'
        run: pnpm exec convex run seed:seedCatalog

      - name: Seed tasting Catalog
        if: github.event_name == 'workflow_dispatch'
        run: pnpm exec convex run seed:seedTastingCatalog

      # VITE_CONVEX_URL comes from the stg Environment, as the production URL.
      - name: Build staging
        if: github.event_name != 'workflow_dispatch'
        run: pnpm build

      # Without the name check, a build without CLOUDFLARE_ENV would silently
      # replace the production Worker from a staging deploy.
      - name: Deploy Worker
        run: |
          built=$(jq -r .name dist/server/wrangler.json)
          if [ "$built" != "$WORKER_NAME" ]; then
            echo "::error::Build targets Worker '$built', expected '$WORKER_NAME'."
            exit 1
          fi
          pnpm exec wrangler deploy
