name: Deploy

# A merge to main: checks → staging → production → preview app update
# (ADR 0044, the release standard). Production deploys the commit staging just
# ran, through the same steps, once staging's smoke check passed. There is no
# click and no reviewer: the gate is the merge, which the manager asks the owner
# about on a decision card when a change is `high` or could block installed app
# builds (RUNBOOK).
#
# Staging is a frontend on the production Convex deployment (ADR 0039): only
# the production job changes the backend, a few minutes after staging's Worker.
#
# A manual "Run workflow" redeploys main through the same chain; any other ref
# runs only the checks.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One Deploy run at a time, in the order they started, so an older merge can
# never reach staging, production or the preview app after a newer one. A newer
# run waiting behind another replaces the older waiting one; nothing in flight
# is cancelled. deploy-web.yml also refuses to deploy over a newer commit, for
# a re-run of an old run.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # The same suite as pull requests, because admins can bypass required checks.
  # Called without `secrets: inherit`, so its build uploads no source maps.
  checks:
    uses: ./.github/workflows/ci.yml
    permissions: { contents: read }

  staging:
    needs: checks
    # Deploys ship main only, also from a manual run.
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-web.yml
    permissions: { contents: read }
    with:
      environment: staging
      worker: gather-staging
      url: https://gather-stg.appelent.nl
    secrets: inherit

  production:
    needs: staging
    uses: ./.github/workflows/deploy-web.yml
    permissions: { contents: read }
    with:
      environment: production
      worker: gather
      url: https://gather.appelent.nl
    secrets: inherit

  # The preview app calls production Convex, so its update waits for the
  # production backend. Skips itself when nothing the app bundles changed.
  mobile:
    needs: production
    uses: ./.github/workflows/mobile-update.yml
    permissions:
      # Moves the ota-preview tag.
      contents: write
    secrets: inherit
