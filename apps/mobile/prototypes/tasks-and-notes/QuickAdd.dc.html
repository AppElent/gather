<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif; }
    a { color: #8a6a33; text-decoration: none; }
    a:hover { color: #6d5327; }
    .ic { flex: none; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #faf9f7; color: #1f2421; display: flex; flex-direction: column;">

  <div style="height: 47px; flex: none;"></div>
  <div style="flex: 1; min-height: 0; padding: 0 16px; display: flex; flex-direction: column; justify-content: flex-start; gap: 14px; padding-top: 20px; opacity: 0.5;">
    <div style="font-size: 32px; font-weight: 800; letter-spacing: -0.9px;">Home</div>
    <div style="height: 96px; border-radius: 16px; background: #ffffff; border: 1px solid #e8e7e3;"></div>
    <div style="height: 96px; border-radius: 16px; background: #ffffff; border: 1px solid #e8e7e3;"></div>
  </div>
  <div style="flex: none; display: flex; height: 49px; background: #ffffff; border-top: 1px solid #e8e7e3;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #79807b;"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 10v10h14V10"></path></svg><span style="font-size: 10px;">Home</span></div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #79807b;"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><span style="font-size: 10px;">Search</span></div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #8a6a33;"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8"></path><path d="M8 12h8"></path></svg><span style="font-size: 10px; font-weight: 600;">Add</span></div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #79807b;"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3"></path><path d="M12 19v3"></path><path d="M2 12h3"></path><path d="M19 12h3"></path><path d="m4.9 4.9 2.1 2.1"></path><path d="m17 17 2.1 2.1"></path><path d="M19.1 4.9 17 7"></path><path d="M7 17l-2.1 2.1"></path></svg><span style="font-size: 10px;">Settings</span></div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #79807b;"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.6"></rect><rect x="14" y="3" width="7" height="7" rx="1.6"></rect><rect x="3" y="14" width="7" height="7" rx="1.6"></rect><rect x="14" y="14" width="7" height="7" rx="1.6"></rect></svg><span style="font-size: 10px;">All</span></div>
  </div>
  <div style="height: 34px; flex: none; background: #ffffff;"></div>

  <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(31, 36, 33, 0.34);"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #ffffff; border-radius: 20px 20px 0 0; padding: 12px 16px 30px; display: flex; flex-direction: column; gap: 14px;">
    <div style="width: 38px; height: 4px; border-radius: 2px; background: #e8e7e3; align-self: center;"></div>
    <div style="font-size: 21px; font-weight: 700; letter-spacing: -0.4px;">Add</div>

    <div style="background: #ffffff; border: 1.5px solid #8a6a33; border-radius: 12px; padding: 0 13px; display: flex; align-items: center; gap: 11px; min-height: 50px;">
      <svg class="ic" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8a6a33" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m3 5 2 2 3-3"></path><path d="m3 13 2 2 3-3"></path><path d="M13 6h8"></path><path d="M13 15h8"></path></svg>
      <span style="flex: 1; font-size: 16px;">Order more coffee<span style="display: inline-block; width: 2px; height: 18px; background: #8a6a33; vertical-align: -3px; margin-left: 1px;"></span></span>
    </div>

    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 13.5px; color: #79807b;">Goes in</span>
      <span onClick="{{ openPicker }}" style="display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 700; color: #8a6a33; background: #f2ece0; border-radius: 999px; padding: 6px 12px; cursor: pointer;">{{ listName }}<svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8a6a33" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></span>
      <span style="font-size: 12.5px; color: #79807b;">{{ why }}</span>
    </div>

    <sc-if value="{{ pickerOpen }}" hint-placeholder-val="{{ false }}">
      <div style="border: 1px solid #e8e7e3; border-radius: 14px; overflow: hidden;">
        <sc-for list="{{ options }}" as="o" hint-placeholder-count="4">
          <div onClick="{{ o.pick }}" style="display: flex; align-items: center; gap: 11px; padding: 0 13px; min-height: 48px; border-bottom: 1px solid #e8e7e3; cursor: pointer;">
            <span style="flex: 1; font-size: 15.5px;">{{ o.name }}</span>
            <div style="{{ o.checkStyle }}"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a6a33" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></div>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <div style="display: flex; gap: 10px;">
      <div style="flex: 1; min-height: 50px; border-radius: 12px; background: #f1f2f0; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;">Cancel</div>
      <div style="flex: 2; min-height: 50px; border-radius: 12px; background: #8a6a33; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;">Add task</div>
    </div>

    <div style="display: flex; gap: 22px; padding-top: 2px; border-top: 1px solid #e8e7e3; padding-top: 14px;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; color: #79807b;"><svg class="ic" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20.5h12"></path><path d="M7 17.5h10l1-7A4 4 0 0 0 15 6a4 4 0 0 0-6 0 4 4 0 0 0-3 4.5z"></path></svg><span style="font-size: 11px;">Recipe</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; color: #79807b;"><svg class="ic" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12h.01"></path><path d="M15 12h.01"></path><path d="M10 16c.5.3 1.2.5 2 .5s1.5-.2 2-.5"></path><path d="M19 6.3a9 9 0 0 1 1.8 3.9 2 2 0 0 1 0 3.6 9 9 0 0 1-17.6 0 2 2 0 0 1 0-3.6A9 9 0 0 1 12 3c2 0 3.5 1.1 3.5 2.5S14.5 8 13 8c-1.5 0-2.5-.5-2.5-1.5"></path></svg><span style="font-size: 11px;">Baby</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; color: #8a6a33;"><svg class="ic" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m3 5 2 2 3-3"></path><path d="m3 13 2 2 3-3"></path><path d="M13 6h8"></path><path d="M13 15h8"></path></svg><span style="font-size: 11px; font-weight: 700;">Task</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; color: #79807b;"><svg class="ic" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h6"></path><path d="M2 6h2"></path><path d="M2 10h2"></path><path d="M2 14h2"></path><path d="M2 18h2"></path><path d="M21.4 9.6a2 2 0 0 1 0 2.8l-6.3 6.3-3.5.7.7-3.5 6.3-6.3a2 2 0 0 1 2.8 0z"></path></svg><span style="font-size: 11px;">Note</span></div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { list: 'Household', picker: false };
  }

  renderVals() {
    const CHECK_ON = 'width:20px;height:20px;display:flex;align-items:center;justify-content:center;';
    const CHECK_OFF = CHECK_ON + 'opacity:0;';
    const names = ['Household', 'Shopping', 'Emma to-dos', 'Emma questions'];
    return {
      listName: this.state.list,
      why: this.state.list === 'Household' ? 'last list you added to' : '',
      pickerOpen: this.state.picker,
      openPicker: () => this.setState({ picker: !this.state.picker }),
      options: names.map((name) => ({
        name: name,
        checkStyle: this.state.list === name ? CHECK_ON : CHECK_OFF,
        pick: () => this.setState({ list: name, picker: false })
      }))
    };
  }
}
</script>
</body>
</html>
