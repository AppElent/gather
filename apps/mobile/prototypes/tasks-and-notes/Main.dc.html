<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: {} };
  }

  renderVals() {
    const items = [
      { id: 'parcel', title: 'Pick up the parcel from the DHL point', list: 'Household', due: 'Today' },
      { id: 'bread', title: 'Bread and something for Thursday', list: 'Shopping', due: 'Today' }
    ];
    const done = this.state.done;
    const ROW = 'display:flex;align-items:center;gap:11px;min-height:56px;cursor:pointer;';
    return {
      householdOpen: done.parcel ? '6' : '7',
      today: items.map((item, i) => {
        const on = !!done[item.id];
        return {
          title: item.title,
          list: item.list,
          due: on ? 'Done' : item.due,
          rowStyle: ROW + (i === 0 ? 'border-bottom:1px solid #e8e7e3;' : ''),
          titleStyle: 'font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;' + (on ? 'color:#79807b;text-decoration:line-through;' : 'color:#1f2421;'),
          dueStyle: 'font-size:12.5px;font-weight:700;white-space:nowrap;' + (on ? 'color:#79807b;' : 'color:#8a6a33;'),
          on: on,
          off: !on,
          toggle: () => {
            const next = Object.assign({}, this.state.done);
            next[item.id] = !next[item.id];
            this.setState({ done: next });
          }
        };
      })
    };
  }
}
</script>
