<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif; }
    a { color: #8a6a33; text-decoration: none; }
    a:hover { color: #6d5327; }
    .ic { flex: none; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #faf9f7; color: #1f2421; display: flex; flex-direction: column;">

  <div style="height: 47px; flex: none;"></div>
  <div style="flex: none; display: flex; align-items: center; height: 52px; padding: 0 16px 0 8px; gap: 8px;">
    <div style="flex: 1; display: flex; align-items: center; gap: 1px; color: #8a6a33; cursor: pointer; min-width: 0;"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a6a33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg><span style="font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Household</span></div>
    <div style="font-size: 17px; font-weight: 700; letter-spacing: -0.3px; white-space: nowrap;">Task</div>
    <div style="flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: 17px;"></div>
  </div>
  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 18px;">
    <div style="background: #ffffff; border: 1px solid #e8e7e3; border-radius: 16px; padding: 16px 15px; display: flex; gap: 12px; align-items: flex-start;">
      <div style="margin-top: 3px;"><div style="width: 21px; height: 21px; border-radius: 6px; border: 1.6px solid #e8e7e3; flex: none;"></div></div>
      <div style="flex: 1; font-size: 21px; font-weight: 700; line-height: 28px; letter-spacing: -0.4px; text-wrap: pretty;">Call the plumber about the radiator</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; color: #79807b; padding-left: 2px;">PRIORITY</div>
      <div style="display: flex; background: #f1f2f0; border-radius: 11px; padding: 3px;">
        <sc-for list="{{ priorities }}" as="p" hint-placeholder-count="5">
          <div onClick="{{ p.pick }}" style="{{ p.style }}">{{ p.name }}</div>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; color: #79807b; padding-left: 2px;">DUE DATE</div>
      <div style="background: #ffffff; border: 1px solid #e8e7e3; border-radius: 16px; padding: 13px 12px 14px; display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px;">
          <span style="font-size: 15px; font-weight: 700;">August 2026</span>
          <div style="display: flex; gap: 16px;"><svg class="ic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8a6a33" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg><svg class="ic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8a6a33" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px;">
          <sc-for list="{{ weekdays }}" as="w" hint-placeholder-count="7">
            <div style="text-align: center; font-size: 11px; font-weight: 700; color: #79807b;">{{ w }}</div>
          </sc-for>
          <sc-for list="{{ days }}" as="d" hint-placeholder-count="35">
            <div onClick="{{ d.pick }}" style="{{ d.style }}">{{ d.n }}</div>
          </sc-for>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; color: #79807b; padding-left: 2px;">LABELS</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <sc-for list="{{ labels }}" as="l" hint-placeholder-count="4">
          <span onClick="{{ l.pick }}" style="{{ l.style }}">{{ l.name }}</span>
        </sc-for>
        <span style="font-size: 13.5px; font-weight: 600; padding: 7px 13px; border-radius: 999px; border: 1px dashed #e8e7e3; color: #79807b;">+ New</span>
      </div>
    </div>

    <div style="background: #ffffff; border: 1px solid #e8e7e3; border-radius: 16px; padding: 0 14px; overflow: hidden;"><div style="display: flex; align-items: center; gap: 11px; min-height: 54px;"><svg class="ic" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#a4372c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16"></path><path d="M9.5 6.5V4h5v2.5"></path><path d="m6.5 6.5 1 13.5h9l1-13.5"></path></svg><span style="flex: 1; font-size: 16px; color: #a4372c;">Delete task</span></div></div>
  </div>
  <div style="flex: none; display: flex; height: 49px; background: #ffffff; border-top: 1px solid #e8e7e3;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #79807b;"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 10v10h14V10"></path></svg><span style="font-size: 10px;">Home</span></div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #79807b;"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><span style="font-size: 10px;">Search</span></div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #79807b;"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8"></path><path d="M8 12h8"></path></svg><span style="font-size: 10px;">Add</span></div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #79807b;"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3"></path><path d="M12 19v3"></path><path d="M2 12h3"></path><path d="M19 12h3"></path><path d="m4.9 4.9 2.1 2.1"></path><path d="m17 17 2.1 2.1"></path><path d="M19.1 4.9 17 7"></path><path d="M7 17l-2.1 2.1"></path></svg><span style="font-size: 10px;">Settings</span></div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #8a6a33;"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.6"></rect><rect x="14" y="3" width="7" height="7" rx="1.6"></rect><rect x="3" y="14" width="7" height="7" rx="1.6"></rect><rect x="14" y="14" width="7" height="7" rx="1.6"></rect></svg><span style="font-size: 10px; font-weight: 600;">All</span></div>
  </div>
  <div style="height: 34px; flex: none; background: #ffffff;"></div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { priority: 1, day: 19, labels: { house: true } };
  }

  renderVals() {
    const names = ['None', 'P1', 'P2', 'P3', 'P4'];
    const SEG_ON = 'flex:1;text-align:center;font-size:14px;font-weight:700;padding:9px 0;border-radius:9px;background:#ffffff;color:#1f2421;box-shadow:0 1px 3px rgba(31,36,33,0.12);cursor:pointer;';
    const SEG_OFF = 'flex:1;text-align:center;font-size:14px;font-weight:600;padding:9px 0;border-radius:9px;color:#79807b;cursor:pointer;';
    const days = [];
    for (let i = 0; i < 5; i++) days.push({ n: '', blank: true });
    for (let n = 1; n <= 31; n++) days.push({ n: String(n), blank: false });
    const DAY = 'height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:13.5px;cursor:pointer;';
    return {
      weekdays: ['M', 'T', 'W', 'T', 'F', 'S', 'S'],
      priorities: names.map((name, i) => ({
        name: name,
        style: this.state.priority === i ? SEG_ON : SEG_OFF,
        pick: () => this.setState({ priority: i })
      })),
      days: days.map((d) => ({
        n: d.n,
        style: d.blank
          ? DAY + 'cursor:default;'
          : (Number(d.n) === this.state.day
              ? DAY + 'background:#8a6a33;color:#ffffff;font-weight:700;'
              : DAY + 'color:#1f2421;'),
        pick: d.blank ? null : (() => this.setState({ day: Number(d.n) }))
      })),
      labels: ['house', 'car', 'admin', 'garden'].map((name) => ({
        name: name,
        style: this.state.labels[name]
          ? 'font-size:13.5px;font-weight:600;padding:7px 13px;border-radius:999px;background:#8a6a33;color:#ffffff;cursor:pointer;'
          : 'font-size:13.5px;font-weight:600;padding:7px 13px;border-radius:999px;background:#ffffff;color:#1f2421;border:1px solid #e8e7e3;cursor:pointer;',
        pick: () => {
          const next = Object.assign({}, this.state.labels);
          next[name] = !next[name];
          this.setState({ labels: next });
        }
      }))
    };
  }
}
</script>
</body>
</html>
