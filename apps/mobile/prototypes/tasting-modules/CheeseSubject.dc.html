<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif; }
    a { color: #7d3f5f; text-decoration: none; }
    a:hover { color: #5f2f47; }
    .ic { flex: none; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #faf9f7; color: #1f2421; display: flex; flex-direction: column;">

  <div style="position: relative; flex: none; height: 236px; background: linear-gradient(160deg, #e9dcc6 0%, #d8c49f 55%, #c9b184 100%);">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: linear-gradient(to bottom, rgba(31,36,33,0), rgba(31,36,33,0.28));"></div>
    <div style="position: absolute; left: 12px; top: 55px; width: 34px; height: 34px; border-radius: 17px; background: rgba(255,255,255,0.86); display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1f2421" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
    </div>
    <div style="position: absolute; right: 12px; top: 55px; width: 34px; height: 34px; border-radius: 17px; background: rgba(255,255,255,0.86); display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="#1f2421"><circle cx="5" cy="12" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="19" cy="12" r="1.7"></circle></svg>
    </div>
  </div>

  <div style="flex: none; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 13px; background: #faf9f7; border-bottom: 1px solid #e8e7e3;">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="font-size: 26px; font-weight: 700; letter-spacing: -0.7px;">Comte 24 months</div>
      <div style="font-size: 13.5px; color: #79807b;">Cow · France · Hard · Marcel Petite</div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 7px;">
        <div style="display: flex; gap: 2px;">
          <sc-for list="{{ avgStars }}" as="st" hint-placeholder-count="5">
            <div style="position: relative; width: 18px; height: 18px;">
              <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d8d6d0" stroke-width="1.6" stroke-linejoin="round"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"></path></svg>
              <div style="position: absolute; left: 0; top: 0; height: 18px; overflow: hidden; width: {{ st.w }};">
                <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="#7d3f5f" stroke="#7d3f5f" stroke-width="1.6" stroke-linejoin="round"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"></path></svg>
              </div>
            </div>
          </sc-for>
        </div>
        <span style="font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums;">4.3</span>
        <span style="font-size: 13px; color: #79807b;">from 3</span>
      </div>
      <div style="flex: 1;"></div>
      <div style="display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 15px; border-radius: 12px; background: #7d3f5f; color: #ffffff; font-size: 14.5px; font-weight: 700; cursor: pointer;">
        <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
        Tasting
      </div>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 14px 16px 0;">
    <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; color: #79807b; padding-bottom: 4px;">TASTINGS</div>

    <sc-for list="{{ tastings }}" as="t" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 13px 0; border-bottom: 1px solid #e8e7e3;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="{{ t.avatarStyle }}">{{ t.initial }}</div>
          <span style="font-size: 15px; font-weight: 600;">{{ t.who }}</span>
          <span style="font-size: 13px; color: #79807b;">{{ t.when }}</span>
          <span style="flex: 1;"></span>
          <span style="font-size: 16px; font-weight: 700; color: #7d3f5f; font-variant-numeric: tabular-nums;">{{ t.score }}</span>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 6px;">
          <sc-for list="{{ t.tags }}" as="tag" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; min-height: 26px; padding: 0 10px; border-radius: 999px; background: #f0e6ec; color: #7d3f5f; font-size: 12.5px;">{{ tag }}</div>
          </sc-for>
        </div>
        <div style="display: flex; gap: 14px;">
          <sc-for list="{{ t.scales }}" as="sc" hint-placeholder-count="2">
            <div style="display: flex; align-items: center; gap: 6px;">
              <span style="font-size: 12px; color: #79807b;">{{ sc.label }}</span>
              <div style="display: flex; gap: 3px;">
                <sc-for list="{{ sc.pips }}" as="pip" hint-placeholder-count="5">
                  <div style="{{ pip }}"></div>
                </sc-for>
              </div>
            </div>
          </sc-for>
        </div>
        <sc-if value="{{ t.hasNote }}" hint-placeholder-val="{{ true }}">
          <div style="font-size: 13.5px; line-height: 19px; color: #1f2421; text-wrap: pretty;">{{ t.note }}</div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="flex: none; display: flex; height: 49px; background: #ffffff; border-top: 1px solid #e8e7e3;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #79807b;">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 10v10h14V10"></path></svg>
      <span style="font-size: 10px;">Home</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #79807b;">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.34-4.34"></path></svg>
      <span style="font-size: 10px;">Search</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #79807b;">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 12h8"></path><path d="M12 8v8"></path></svg>
      <span style="font-size: 10px;">Add</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #79807b;">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3"></path><path d="M12 19v3"></path><path d="M2 12h3"></path><path d="M19 12h3"></path><path d="m4.9 4.9 2.1 2.1"></path><path d="m17 17 2.1 2.1"></path><path d="M19.1 4.9 17 7"></path><path d="M7 17l-2.1 2.1"></path></svg>
      <span style="font-size: 10px;">Settings</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #1f2421;">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.6"></rect><rect x="14" y="3" width="7" height="7" rx="1.6"></rect><rect x="3" y="14" width="7" height="7" rx="1.6"></rect><rect x="14" y="14" width="7" height="7" rx="1.6"></rect></svg>
      <span style="font-size: 10px; font-weight: 600;">All</span>
    </div>
  </div>
  <div style="height: 34px; flex: none; background: #ffffff;"></div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  pips(value) {
    const on = 'width: 12px; height: 5px; border-radius: 3px; background: #7d3f5f;';
    const off = 'width: 12px; height: 5px; border-radius: 3px; background: #e2e0dc;';
    return [1, 2, 3, 4, 5].map((n) => (n <= value ? on : off));
  }

  renderVals() {
    const avgStars = [1, 2, 3, 4, 5].map((n) => {
      const filled = 4.3 - (n - 1);
      return { w: filled >= 1 ? '18px' : (filled >= 0.5 ? '9px' : '0px') };
    });

    const rows = [
      {
        who: 'You', initial: 'E', when: 'today', score: '4.5', tone: '#f0e6ec', ink: '#7d3f5f',
        tags: ['nutty', 'caramel', 'hay'],
        scales: [{ label: 'Firmness', v: 4 }, { label: 'Saltiness', v: 3 }],
        note: 'The crystals are back in this batch. Buy the same wheel again.'
      },
      {
        who: 'Nora', initial: 'N', when: '2 weeks ago', score: '4.5', tone: '#e2f2f0', ink: '#2b7f86',
        tags: ['nutty', 'crystalline'],
        scales: [{ label: 'Firmness', v: 5 }, { label: 'Saltiness', v: 3 }],
        note: ''
      },
      {
        who: 'Sam', initial: 'S', when: 'in June', score: '4.0', tone: '#f2ece0', ink: '#8a6a33',
        tags: ['hay', 'butter'],
        scales: [{ label: 'Firmness', v: 4 }, { label: 'Saltiness', v: 2 }],
        note: 'Younger wheel, softer. Fine but not the one.'
      }
    ];

    return {
      avgStars: avgStars,
      tastings: rows.map((row) => ({
        who: row.who,
        initial: row.initial,
        when: row.when,
        score: row.score,
        tags: row.tags,
        hasNote: row.note.length > 0,
        note: row.note,
        avatarStyle: 'width: 24px; height: 24px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 700; background: ' + row.tone + '; color: ' + row.ink + ';',
        scales: row.scales.map((sc) => ({ label: sc.label, pips: this.pips(sc.v) }))
      }))
    };
  }
}
</script>
</body>
</html>
