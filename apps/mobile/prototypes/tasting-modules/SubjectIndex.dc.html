<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif; }
    a { color: #7d3f5f; text-decoration: none; }
    a:hover { color: #5f2f47; }
    .ic { flex: none; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #faf9f7; color: #1f2421; display: flex; flex-direction: column;">

  <div style="height: 47px; flex: none;"></div>

  <div style="flex: none; display: flex; align-items: center; height: 44px; padding: 0 12px 0 6px;">
    <div style="display: flex; align-items: center; gap: 2px; min-height: 44px; padding-right: 6px; color: #7d3f5f; cursor: pointer;">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
      <span style="font-size: 17px;">All</span>
    </div>
    <div style="flex: 1;"></div>
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-end; color: #7d3f5f; cursor: pointer;">
      <svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
    </div>
  </div>

  <div style="flex: none; display: flex; flex-direction: column; gap: 10px; padding: 0 16px 12px;">
    <div style="font-size: 32px; font-weight: 700; letter-spacing: -0.8px;">{{ title }}</div>
    <div style="display: flex; align-items: center; gap: 9px; min-height: 40px; padding: 0 12px; background: #f1f2f0; border-radius: 11px;">
      <svg class="ic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#79807b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.34-4.34"></path></svg>
      <span style="font-size: 16px; color: #79807b;">Search</span>
    </div>
    <div style="font-size: 13px; color: #79807b;">{{ summary }}</div>
  </div>

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 0 16px;">
    <sc-for list="{{ rows }}" as="row" hint-placeholder-count="6">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 70px; border-bottom: 1px solid #e8e7e3; cursor: pointer;">
        <div style="{{ row.thumbStyle }}">
          <sc-if value="{{ row.noPhoto }}" hint-placeholder-val="{{ false }}">
            <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c4c8c5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>
          </sc-if>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
          <div style="font-size: 16px; font-weight: 600;">{{ row.name }}</div>
          <div style="font-size: 13px; color: #79807b;">{{ row.facts }}</div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px;">
          <div style="display: flex; align-items: center; gap: 4px;">
            <svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="#7d3f5f" stroke="#7d3f5f" stroke-width="1.5" stroke-linejoin="round"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"></path></svg>
            <span style="font-size: 16px; font-weight: 700; color: #7d3f5f; font-variant-numeric: tabular-nums;">{{ row.score }}</span>
          </div>
          <span style="font-size: 12px; color: #79807b;">{{ row.count }}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="flex: none; display: flex; height: 49px; background: #ffffff; border-top: 1px solid #e8e7e3;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #79807b;">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 10v10h14V10"></path></svg>
      <span style="font-size: 10px;">Home</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #79807b;">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.34-4.34"></path></svg>
      <span style="font-size: 10px;">Search</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #79807b;">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 12h8"></path><path d="M12 8v8"></path></svg>
      <span style="font-size: 10px;">Add</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #79807b;">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3"></path><path d="M12 19v3"></path><path d="M2 12h3"></path><path d="M19 12h3"></path><path d="m4.9 4.9 2.1 2.1"></path><path d="m17 17 2.1 2.1"></path><path d="M19.1 4.9 17 7"></path><path d="M7 17l-2.1 2.1"></path></svg>
      <span style="font-size: 10px;">Settings</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #1f2421;">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.6"></rect><rect x="14" y="3" width="7" height="7" rx="1.6"></rect><rect x="3" y="14" width="7" height="7" rx="1.6"></rect><rect x="14" y="14" width="7" height="7" rx="1.6"></rect></svg>
      <span style="font-size: 10px; font-weight: 600;">All</span>
    </div>
  </div>
  <div style="height: 34px; flex: none; background: #ffffff;"></div>

</div>
</x-dc>
<script data-dc-script data-props='{"kind":{"editor":"enum","options":["cheeses","wines","beers"],"default":"cheeses"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  data() {
    return {
      cheeses: {
        title: 'Cheeses',
        summary: '6 cheeses · 14 tastings · Home',
        rows: [
          { name: 'Comte 24 months', facts: 'Cow · France · Hard', score: '4.3', count: '3 tastings', photo: '#e7dcd0' },
          { name: 'Roquefort Papillon', facts: 'Sheep · France · Blue', score: '4.0', count: '2 tastings', photo: '#dfe3e6' },
          { name: 'Boerenkaas Remeker', facts: 'Cow · Netherlands · Hard', score: '3.5', count: '1 tasting', photo: null },
          { name: 'Manchego 12 months', facts: 'Sheep · Spain · Hard', score: '3.8', count: '4 tastings', photo: '#e4dcc6' },
          { name: 'Epoisses', facts: 'Cow · France · Soft', score: '4.5', count: '2 tastings', photo: '#eadfc2' },
          { name: 'Brie de Meaux', facts: 'Cow · France · Soft', score: '3.0', count: '2 tastings', photo: null }
        ]
      },
      wines: {
        title: 'Wines',
        summary: '5 wines · 11 tastings · Home',
        rows: [
          { name: 'Vajra Barolo 2019', facts: 'Nebbiolo · Piedmont · Red', score: '4.5', count: '3 tastings', photo: '#d9cdd3' },
          { name: 'Laroche Chablis 2022', facts: 'Chardonnay · Burgundy · White', score: '4.0', count: '2 tastings', photo: '#dfe2d8' },
          { name: 'Lopez de Heredia Tondonia 2012', facts: 'Tempranillo · Rioja · Red', score: '4.5', count: '2 tastings', photo: null },
          { name: 'Huet Vouvray Sec 2021', facts: 'Chenin blanc · Loire · White', score: '3.5', count: '2 tastings', photo: '#e2e5dc' },
          { name: 'Vinho Verde, house', facts: 'Loureiro · Minho · White', score: '2.5', count: '2 tastings', photo: null }
        ]
      },
      beers: {
        title: 'Beers',
        summary: '4 beers · 7 tastings · Home',
        rows: [
          { name: 'Westmalle Tripel', facts: 'Trappist tripel · 9.5%', score: '4.5', count: '3 tastings', photo: '#e6d9bf' },
          { name: 'Duvel', facts: 'Belgian strong golden · 8.5%', score: '4.0', count: '2 tastings', photo: null },
          { name: 'Jopen Hoppenbier', facts: 'Amber ale · 6.8%', score: '3.5', count: '1 tasting', photo: '#e0d4c0' },
          { name: 'Oedipus Mannenliefde', facts: 'Saison · 6.0%', score: '3.0', count: '1 tasting', photo: null }
        ]
      }
    };
  }

  renderVals() {
    const set = this.data()[this.props.kind ?? 'cheeses'];
    return {
      title: set.title,
      summary: set.summary,
      rows: set.rows.map((row) => ({
        name: row.name,
        facts: row.facts,
        score: row.score,
        count: row.count,
        noPhoto: !row.photo,
        thumbStyle: 'width: 48px; height: 48px; flex: none; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: ' + (row.photo || '#f1f2f0') + ';'
      }))
    };
  }
}
</script>
</body>
</html>
