<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { kind: 'cheese', rating: 4, firmness: 4 };
  }

  renderVals() {
    const SEG_ON = 'flex: 1; min-height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #f0e6ec; border: 1px solid #7d3f5f; color: #7d3f5f; font-size: 14px; font-weight: 700; cursor: pointer;';
    const SEG_OFF = 'flex: 1; min-height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #ffffff; border: 1px solid #e8e7e3; color: #1f2421; font-size: 14px; cursor: pointer;';
    const subjects = { cheese: 'Comte 24 months', wine: 'Vajra Barolo 2019', beer: 'Westmalle Tripel' };

    const kinds = [
      { key: 'cheese', label: 'Cheese' },
      { key: 'wine', label: 'Wine' },
      { key: 'beer', label: 'Beer' }
    ].map((k) => ({
      label: k.label,
      style: this.state.kind === k.key ? SEG_ON : SEG_OFF,
      pick: () => this.setState({ kind: k.key })
    }));

    const stars = [1, 2, 3, 4, 5].map((n) => {
      const filled = this.state.rating - (n - 1);
      return {
        w: filled >= 1 ? '30px' : (filled >= 0.5 ? '15px' : '0px'),
        half: () => this.setState({ rating: n - 0.5 }),
        full: () => this.setState({ rating: n })
      };
    });

    const SEL = 'flex: 1; min-height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #f0e6ec; border: 1px solid #7d3f5f; color: #7d3f5f; font-size: 15px; font-weight: 700; cursor: pointer;';
    const OFF = 'flex: 1; min-height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #ffffff; border: 1px solid #e8e7e3; color: #1f2421; font-size: 15px; cursor: pointer;';
    const firmness = [1, 2, 3, 4, 5].map((n) => ({
      n: String(n),
      style: this.state.firmness === n ? SEL : OFF,
      pick: () => this.setState({ firmness: n })
    }));

    return {
      kinds: kinds,
      subject: subjects[this.state.kind],
      stars: stars,
      ratingLabel: this.state.rating.toFixed(1),
      firmness: firmness
    };
  }
}
</script>
