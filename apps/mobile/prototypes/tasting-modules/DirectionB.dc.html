<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif; }
    a { color: #7d3f5f; text-decoration: none; }
    a:hover { color: #5f2f47; }
    .ic { flex: none; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #faf9f7; color: #1f2421; display: flex; flex-direction: column;">

  <div style="height: 47px; flex: none; background: #ffffff;"></div>

  <div style="flex: none; display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px 0 6px; background: #ffffff; border-bottom: 1px solid #e8e7e3;">
    <div style="display: flex; align-items: center; gap: 2px; min-height: 44px; padding-right: 6px; color: #7d3f5f; cursor: pointer;">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
      <span style="font-size: 17px;">Home</span>
    </div>
    <div style="flex: 1; text-align: center; font-size: 17px; font-weight: 600; letter-spacing: -0.2px;">Cheese tasting</div>
    <div style="min-width: 52px; display: flex; justify-content: flex-end; min-height: 44px; align-items: center; font-size: 17px; font-weight: 700; color: #7d3f5f; cursor: pointer;">Save</div>
  </div>

  <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 14px 16px 0;">

    <sc-if value="{{ picking }}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; align-items: center; gap: 9px; min-height: 46px; padding: 0 13px; background: #ffffff; border: 1px solid #7d3f5f; border-radius: 12px;">
          <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#79807b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.34-4.34"></path></svg>
          <span style="flex: 1; font-size: 16px; color: #a9aeaa;">Which cheese?</span>
        </div>
        <sc-for list="{{ options }}" as="o" hint-placeholder-count="4">
          <div onClick="{{ o.press }}" style="display: flex; align-items: center; gap: 11px; min-height: 52px; border-bottom: 1px solid #e8e7e3; cursor: pointer;">
            <div style="{{ o.dotStyle }}"></div>
            <div style="flex: 1; display: flex; flex-direction: column; gap: 1px;">
              <div style="font-size: 16px;">{{ o.name }}</div>
              <div style="font-size: 13px; color: #79807b;">{{ o.facts }}</div>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{ picked }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 16px;">

        <div style="display: flex; gap: 12px;">
          <div style="width: 96px; height: 96px; flex: none; border-radius: 16px; background: #f1f2f0; border: 1px dashed #d8d6d0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer;">
            <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#79807b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"></path><circle cx="12" cy="13" r="3"></circle></svg>
            <span style="font-size: 11.5px; color: #79807b;">Photo</span>
          </div>
          <div onClick="{{ repick }}" style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 4px; cursor: pointer;">
            <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.4px;">{{ name }}</div>
            <div style="font-size: 13.5px; color: #79807b;">{{ facts }}</div>
            <div style="font-size: 13px; color: #7d3f5f; font-weight: 600;">Change</div>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 12px;">
          <div style="display: flex; gap: 4px;">
            <sc-for list="{{ stars }}" as="st" hint-placeholder-count="5">
              <div style="position: relative; width: 34px; height: 34px;">
                <svg class="ic" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#d8d6d0" stroke-width="1.5" stroke-linejoin="round"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"></path></svg>
                <div style="position: absolute; left: 0; top: 0; height: 34px; overflow: hidden; width: {{ st.w }};">
                  <svg class="ic" width="34" height="34" viewBox="0 0 24 24" fill="#7d3f5f" stroke="#7d3f5f" stroke-width="1.5" stroke-linejoin="round"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"></path></svg>
                </div>
                <div onClick="{{ st.half }}" style="position: absolute; left: 0; top: -5px; width: 17px; height: 44px; cursor: pointer;"></div>
                <div onClick="{{ st.full }}" style="position: absolute; left: 17px; top: -5px; width: 17px; height: 44px; cursor: pointer;"></div>
              </div>
            </sc-for>
          </div>
          <div style="font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums;">{{ ratingLabel }}</div>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 14px; background: #ffffff; border: 1px solid #e8e7e3; border-radius: 12px;">
          <span style="font-size: 15px; color: #79807b;">Tasted</span>
          <span style="font-size: 16px; font-weight: 600;">Today</span>
        </div>

        <div style="display: flex; flex-direction: column; gap: 7px;">
          <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; color: #79807b;">FIRMNESS</div>
          <div style="display: flex; gap: 6px;">
            <sc-for list="{{ firmness }}" as="step" hint-placeholder-count="5">
              <div onClick="{{ step.pick }}" style="{{ step.style }}">{{ step.n }}</div>
            </sc-for>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px;">
          <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; color: #79807b;">AROMAS</div>
          <div style="display: flex; flex-wrap: wrap; gap: 7px;">
            <sc-for list="{{ aromas }}" as="a" hint-placeholder-count="5">
              <div onClick="{{ a.toggle }}" style="{{ a.style }}">{{ a.text }}</div>
            </sc-for>
          </div>
        </div>

        <div style="display: flex; align-items: flex-start; min-height: 66px; padding: 13px 14px; background: #ffffff; border: 1px solid #e8e7e3; border-radius: 12px; font-size: 15px; color: #a9aeaa;">Notes</div>
      </div>
    </sc-if>

  </div>

  <div style="flex: none; display: flex; height: 49px; background: #ffffff; border-top: 1px solid #e8e7e3;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #1f2421;">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 10v10h14V10"></path></svg>
      <span style="font-size: 10px;">Home</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #79807b;">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.34-4.34"></path></svg>
      <span style="font-size: 10px;">Search</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #79807b;">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 12h8"></path><path d="M12 8v8"></path></svg>
      <span style="font-size: 10px;">Add</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #79807b;">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3"></path><path d="M12 19v3"></path><path d="M2 12h3"></path><path d="M19 12h3"></path><path d="m4.9 4.9 2.1 2.1"></path><path d="m17 17 2.1 2.1"></path><path d="M19.1 4.9 17 7"></path><path d="M7 17l-2.1 2.1"></path></svg>
      <span style="font-size: 10px;">Settings</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #79807b;">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.6"></rect><rect x="14" y="3" width="7" height="7" rx="1.6"></rect><rect x="3" y="14" width="7" height="7" rx="1.6"></rect><rect x="14" y="14" width="7" height="7" rx="1.6"></rect></svg>
      <span style="font-size: 10px;">All</span>
    </div>
  </div>
  <div style="height: 34px; flex: none; background: #ffffff;"></div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { subject: null, rating: 4, firmness: 4, aromas: { nutty: true } };
  }

  renderVals() {
    const rows = [
      { name: 'Comte 24 months', facts: 'In Home · 4 tastings', mine: true },
      { name: 'Roquefort Papillon', facts: 'In Home · 2 tastings', mine: true },
      { name: 'Gouda', facts: 'Well-known cheese · Cow, Netherlands', mine: false },
      { name: 'Manchego', facts: 'Well-known cheese · Sheep, Spain', mine: false }
    ];

    const options = rows.map((row) => ({
      name: row.name,
      facts: row.facts,
      dotStyle: 'width: 34px; height: 34px; flex: none; border-radius: 10px; background: ' + (row.mine ? '#f0e6ec' : '#f1f2f0') + ';',
      press: () => this.setState({ subject: row })
    }));

    const stars = [1, 2, 3, 4, 5].map((n) => {
      const filled = this.state.rating - (n - 1);
      return {
        w: filled >= 1 ? '34px' : (filled >= 0.5 ? '17px' : '0px'),
        half: () => this.setState({ rating: n - 0.5 }),
        full: () => this.setState({ rating: n })
      };
    });

    const SEL = 'flex: 1; min-height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #f0e6ec; border: 1px solid #7d3f5f; color: #7d3f5f; font-size: 15px; font-weight: 700; cursor: pointer;';
    const OFF = 'flex: 1; min-height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #ffffff; border: 1px solid #e8e7e3; color: #1f2421; font-size: 15px; cursor: pointer;';
    const firmness = [1, 2, 3, 4, 5].map((n) => ({
      n: String(n),
      style: this.state.firmness === n ? SEL : OFF,
      pick: () => this.setState({ firmness: n })
    }));

    const CHIP_ON = 'display: flex; align-items: center; min-height: 34px; padding: 0 13px; border-radius: 999px; background: #f0e6ec; border: 1px solid #7d3f5f; color: #7d3f5f; font-size: 13px; font-weight: 700; cursor: pointer;';
    const CHIP_OFF = 'display: flex; align-items: center; min-height: 34px; padding: 0 13px; border-radius: 999px; background: #ffffff; border: 1px solid #e8e7e3; color: #1f2421; font-size: 13px; cursor: pointer;';
    const aromas = ['nutty', 'hay', 'caramel', 'mushroom', 'butter'].map((word) => {
      const next = Object.assign({}, this.state.aromas);
      next[word] = !next[word];
      return {
        text: word,
        style: this.state.aromas[word] ? CHIP_ON : CHIP_OFF,
        toggle: () => this.setState({ aromas: next })
      };
    });

    const subject = this.state.subject;

    return {
      picking: !subject,
      picked: !!subject,
      options: options,
      name: subject ? subject.name : '',
      facts: subject ? subject.facts : '',
      repick: () => this.setState({ subject: null }),
      stars: stars,
      ratingLabel: this.state.rating.toFixed(1),
      firmness: firmness,
      aromas: aromas
    };
  }
}
</script>
</body>
</html>
