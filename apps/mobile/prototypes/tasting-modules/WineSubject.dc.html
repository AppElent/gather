<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif; }
    a { color: #7d3f5f; text-decoration: none; }
    a:hover { color: #5f2f47; }
    .ic { flex: none; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #faf9f7; color: #1f2421; display: flex; flex-direction: column;">

  <div style="height: 47px; flex: none; background: #ffffff;"></div>

  <div style="flex: none; display: flex; align-items: center; height: 44px; padding: 0 12px 0 6px; background: #ffffff; border-bottom: 1px solid #e8e7e3;">
    <div style="display: flex; align-items: center; gap: 2px; min-height: 44px; padding-right: 6px; color: #7d3f5f; cursor: pointer;">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
      <span style="font-size: 17px;">Wines</span>
    </div>
    <div style="flex: 1; text-align: center; font-size: 17px; font-weight: 600; letter-spacing: -0.2px;">Vajra Barolo 2019</div>
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-end; color: #7d3f5f; cursor: pointer;">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="19" cy="12" r="1.7"></circle></svg>
    </div>
  </div>

  <div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 14px 16px 0;">

    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 76px; height: 76px; flex: none; border-radius: 16px; background: #f1f2f0; border: 1px dashed #d8d6d0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer;">
        <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#79807b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 5h6"></path><path d="M19 2v6"></path><path d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5"></path><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path><circle cx="9" cy="9" r="2"></circle></svg>
        <span style="font-size: 11px; color: #79807b;">Label</span>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 7px;">
          <div style="display: flex; gap: 2px;">
            <sc-for list="{{ avgStars }}" as="st" hint-placeholder-count="5">
              <div style="position: relative; width: 18px; height: 18px;">
                <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d8d6d0" stroke-width="1.6" stroke-linejoin="round"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"></path></svg>
                <div style="position: absolute; left: 0; top: 0; height: 18px; overflow: hidden; width: {{ st.w }};">
                  <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="#7d3f5f" stroke="#7d3f5f" stroke-width="1.6" stroke-linejoin="round"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"></path></svg>
                </div>
              </div>
            </sc-for>
          </div>
          <span style="font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums;">4.5</span>
          <span style="font-size: 13px; color: #79807b;">from 2</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; border-radius: 12px; background: #7d3f5f; color: #ffffff; font-size: 15px; font-weight: 700; cursor: pointer;">
          <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
          Log a tasting
        </div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: #e8e7e3; border: 1px solid #e8e7e3; border-radius: 16px; overflow: hidden;">
      <sc-for list="{{ facts }}" as="f" hint-placeholder-count="6">
        <div style="display: flex; flex-direction: column; gap: 2px; padding: 11px 13px; background: #ffffff;">
          <span style="font-size: 11.5px; font-weight: 700; letter-spacing: 0.6px; color: #79807b;">{{ f.label }}</span>
          <span style="font-size: 15px;">{{ f.value }}</span>
        </div>
      </sc-for>
    </div>

    <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; color: #79807b;">TASTINGS</div>

    <div style="display: flex; flex-direction: column;">
      <sc-for list="{{ tastings }}" as="t" hint-placeholder-count="2">
        <div style="display: flex; flex-direction: column; gap: 7px; padding: 12px 0; border-top: 1px solid #e8e7e3;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <div style="{{ t.avatarStyle }}">{{ t.initial }}</div>
            <span style="font-size: 15px; font-weight: 600;">{{ t.who }}</span>
            <span style="font-size: 13px; color: #79807b;">{{ t.when }}</span>
            <span style="flex: 1;"></span>
            <span style="font-size: 16px; font-weight: 700; color: #7d3f5f; font-variant-numeric: tabular-nums;">{{ t.score }}</span>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 6px;">
            <sc-for list="{{ t.tags }}" as="tag" hint-placeholder-count="4">
              <div style="display: flex; align-items: center; min-height: 26px; padding: 0 10px; border-radius: 999px; background: #f0e6ec; color: #7d3f5f; font-size: 12.5px;">{{ tag }}</div>
            </sc-for>
          </div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px;">
            <sc-for list="{{ t.scales }}" as="sc" hint-placeholder-count="4">
              <div style="display: flex; align-items: center; gap: 7px;">
                <span style="width: 66px; font-size: 12px; color: #79807b;">{{ sc.label }}</span>
                <div style="display: flex; gap: 3px;">
                  <sc-for list="{{ sc.pips }}" as="pip" hint-placeholder-count="5">
                    <div style="{{ pip }}"></div>
                  </sc-for>
                </div>
              </div>
            </sc-for>
          </div>
          <sc-if value="{{ t.hasNote }}" hint-placeholder-val="{{ true }}">
            <div style="font-size: 13.5px; line-height: 19px; text-wrap: pretty;">{{ t.note }}</div>
          </sc-if>
        </div>
      </sc-for>
    </div>

  </div>

  <div style="flex: none; display: flex; height: 49px; background: #ffffff; border-top: 1px solid #e8e7e3;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #1f2421;">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 10v10h14V10"></path></svg>
      <span style="font-size: 10px; font-weight: 600;">Home</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #79807b;">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.34-4.34"></path></svg>
      <span style="font-size: 10px;">Search</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #79807b;">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 12h8"></path><path d="M12 8v8"></path></svg>
      <span style="font-size: 10px;">Add</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #79807b;">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3"></path><path d="M12 19v3"></path><path d="M2 12h3"></path><path d="M19 12h3"></path><path d="m4.9 4.9 2.1 2.1"></path><path d="m17 17 2.1 2.1"></path><path d="M19.1 4.9 17 7"></path><path d="M7 17l-2.1 2.1"></path></svg>
      <span style="font-size: 10px;">Settings</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #79807b;">
      <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.6"></rect><rect x="14" y="3" width="7" height="7" rx="1.6"></rect><rect x="3" y="14" width="7" height="7" rx="1.6"></rect><rect x="14" y="14" width="7" height="7" rx="1.6"></rect></svg>
      <span style="font-size: 10px;">All</span>
    </div>
  </div>
  <div style="height: 34px; flex: none; background: #ffffff;"></div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  pips(value) {
    const on = 'width: 11px; height: 5px; border-radius: 3px; background: #7d3f5f;';
    const off = 'width: 11px; height: 5px; border-radius: 3px; background: #e2e0dc;';
    return [1, 2, 3, 4, 5].map((n) => (n <= value ? on : off));
  }

  renderVals() {
    const avgStars = [1, 2, 3, 4, 5].map((n) => {
      const filled = 4.5 - (n - 1);
      return { w: filled >= 1 ? '18px' : (filled >= 0.5 ? '9px' : '0px') };
    });

    const rows = [
      {
        who: 'Nora', initial: 'N', when: 'yesterday', score: '4.5', tone: '#e2f2f0', ink: '#2b7f86',
        tags: ['cherry', 'leather', 'violet', 'tar'],
        scales: [
          { label: 'Sweetness', v: 1 },
          { label: 'Acidity', v: 4 },
          { label: 'Tannin', v: 5 },
          { label: 'Body', v: 4 }
        ],
        note: 'Still tight. Worth keeping the second bottle another three years.'
      },
      {
        who: 'You', initial: 'E', when: 'yesterday', score: '4.5', tone: '#f0e6ec', ink: '#7d3f5f',
        tags: ['cherry', 'tobacco'],
        scales: [
          { label: 'Sweetness', v: 1 },
          { label: 'Acidity', v: 4 },
          { label: 'Tannin', v: 4 },
          { label: 'Body', v: 5 }
        ],
        note: ''
      }
    ];

    return {
      avgStars: avgStars,
      facts: [
        { label: 'PRODUCER', value: 'G.D. Vajra' },
        { label: 'VINTAGE', value: '2019' },
        { label: 'GRAPE', value: 'Nebbiolo' },
        { label: 'REGION', value: 'Piedmont' },
        { label: 'STYLE', value: 'Red' },
        { label: 'ABV', value: '14.5%' }
      ],
      tastings: rows.map((row) => ({
        who: row.who,
        initial: row.initial,
        when: row.when,
        score: row.score,
        tags: row.tags,
        hasNote: row.note.length > 0,
        note: row.note,
        avatarStyle: 'width: 24px; height: 24px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 700; background: ' + row.tone + '; color: ' + row.ink + ';',
        scales: row.scales.map((sc) => ({ label: sc.label, pips: this.pips(sc.v) }))
      }))
    };
  }
}
</script>
</body>
</html>
