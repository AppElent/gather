<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      tracked: {
        feeding: true,
        diaper: true,
        sleep: true,
        temperature: true,
        note: true,
        growth: false,
        medication: false,
        vaccination: false
      }
    };
  }

  toggle(key) {
    return () => {
      const next = Object.assign({}, this.state.tracked);
      next[key] = !next[key];
      this.setState({ tracked: next });
    };
  }

  renderVals() {
    const TRACK_ON = 'width:51px;height:31px;flex:none;border-radius:16px;background:#8a6a33;display:flex;align-items:center;padding:2px;cursor:pointer;';
    const TRACK_OFF = 'width:51px;height:31px;flex:none;border-radius:16px;background:#e3e2de;display:flex;align-items:center;padding:2px;cursor:pointer;';
    const KNOB_ON = 'width:27px;height:27px;border-radius:14px;background:#ffffff;margin-left:20px;';
    const KNOB_OFF = 'width:27px;height:27px;border-radius:14px;background:#ffffff;margin-left:0px;';

    const t = this.state.tracked;
    const vals = {};
    const keys = ['feeding', 'diaper', 'sleep', 'temperature', 'note', 'growth', 'medication', 'vaccination'];

    keys.forEach((key) => {
      const cap = key.charAt(0).toUpperCase() + key.slice(1);
      vals['track' + cap] = t[key] ? TRACK_ON : TRACK_OFF;
      vals['knob' + cap] = t[key] ? KNOB_ON : KNOB_OFF;
      vals['toggle' + cap] = this.toggle(key);
    });

    return vals;
  }
}
</script>
