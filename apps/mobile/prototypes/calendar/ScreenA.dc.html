<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif; }
    a { color: #8a6a33; text-decoration: none; }
    a:hover { color: #6d5327; }
    .ic { flex: none; }
    input.f { font: inherit; border: 0; outline: 0; background: transparent; color: #1f2421; width: 100%; padding: 0; }
    input.f::placeholder { color: #79807b; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #faf9f7; color: #1f2421; display: flex; flex-direction: column;">

  <div style="height: 47px; flex: none;"></div>
  <div style="flex: none; display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 16px 0 6px;">
    <div style="display: flex; align-items: center; gap: 2px; color: #8a6a33; cursor: pointer;"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a6a33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg><span style="font-size: 17px;">All</span></div>
    <div style="display: flex; align-items: center; gap: 18px;"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8a6a33" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></div>
  </div>
  <div style="flex: none; padding: 2px 16px 10px;">
    <div style="font-size: 32px; font-weight: 800; letter-spacing: -0.9px;">Calendar</div>
    <div style="font-size: 13.5px; color: #79807b; margin-top: 3px;">Huize Jansen</div>
  </div>
  <div style="flex: none; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px;">
    <div onClick="{{ prev }}" style="cursor: pointer;"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a6a33" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></div>
    <div style="font-size: 17px; font-weight: 700; letter-spacing: -0.3px;">{{ monthName }}</div>
    <div onClick="{{ next }}" style="cursor: pointer;"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a6a33" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></div>
    <div style="flex: 1;"></div>
    <div onClick="{{ today }}" style="font-size: 15.5px; font-weight: 600; color: #8a6a33; cursor: pointer;">Today</div>
  </div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); padding: 0 10px; flex: none;"><div style="text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 0.6px; color: #79807b; padding: 4px 0 6px;">M</div><div style="text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 0.6px; color: #79807b; padding: 4px 0 6px;">T</div><div style="text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 0.6px; color: #79807b; padding: 4px 0 6px;">W</div><div style="text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 0.6px; color: #79807b; padding: 4px 0 6px;">T</div><div style="text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 0.6px; color: #79807b; padding: 4px 0 6px;">F</div><div style="text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 0.6px; color: #79807b; padding: 4px 0 6px;">S</div><div style="text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 0.6px; color: #79807b; padding: 4px 0 6px;">S</div></div>
  <div style="flex: none; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; padding: 0 10px;">
    <sc-for list="{{ cells }}" as="c" hint-placeholder-count="35">
      <div onClick="{{ c.pick }}" style="{{ c.style }}">
        <div style="{{ c.numStyle }}">{{ c.num }}</div>
        <div style="display: flex; gap: 3px; height: 6px; align-items: center;">
          <sc-for list="{{ c.dots }}" as="d" hint-placeholder-count="2">
            <span style="{{ d.style }}"></span>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>
  <div style="flex: 1; min-height: 0; overflow: hidden; margin-top: 14px; border-top: 1px solid #e8e7e3; background: #ffffff;">
    <div style="padding: 14px 16px 6px; font-size: 13px; font-weight: 700; letter-spacing: 0.4px; color: #79807b; text-transform: uppercase;">{{ dayLabel }}</div>
    <div style="padding: 0 16px;">
      <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
        <div style="font-size: 15px; color: #79807b; padding: 6px 0 14px;">Nothing on.</div>
      </sc-if>
      <sc-for list="{{ events }}" as="e" hint-placeholder-count="1">
        <div style="display: flex; align-items: center; gap: 11px; min-height: 56px; border-bottom: 1px solid #e8e7e3;">
          <span style="{{ e.bar }}"></span>
          <span style="width: 52px; flex: none; font-size: 12.5px; font-weight: 600; color: #79807b;">{{ e.time }}</span>
          <span style="flex: 1; font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ e.title }}</span>
          <span style="display: inline-flex; gap: 3px; flex: none;">
            <sc-for list="{{ e.who }}" as="w" hint-placeholder-count="2">
              <span style="{{ w.style }}">{{ w.text }}</span>
            </sc-for>
          </span>
        </div>
      </sc-for>
      <div style="display: flex; align-items: center; gap: 9px; min-height: 52px; cursor: pointer;">
        <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a6a33" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg><span style="font-size: 15.5px; color: #8a6a33;">Add an event</span>
      </div>
    </div>
  </div>
  <div style="flex: none; display: flex; height: 49px; background: #ffffff; border-top: 1px solid #e8e7e3;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #79807b;"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 10v10h14V10"></path></svg><span style="font-size: 10px;">Home</span></div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #79807b;"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><span style="font-size: 10px;">Search</span></div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #79807b;"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8"></path><path d="M8 12h8"></path></svg><span style="font-size: 10px;">Add</span></div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #79807b;"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3"></path><path d="M12 19v3"></path><path d="M2 12h3"></path><path d="M19 12h3"></path><path d="m4.9 4.9 2.1 2.1"></path><path d="m17 17 2.1 2.1"></path><path d="M19.1 4.9 17 7"></path><path d="M7 17l-2.1 2.1"></path></svg><span style="font-size: 10px;">Settings</span></div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #8a6a33;"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.6"></rect><rect x="14" y="3" width="7" height="7" rx="1.6"></rect><rect x="3" y="14" width="7" height="7" rx="1.6"></rect><rect x="14" y="14" width="7" height="7" rx="1.6"></rect></svg><span style="font-size: 10px; font-weight: 600;">All</span></div>
  </div>
  <div style="height: 34px; flex: none; background: #ffffff;"></div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const EVENTS = [{"date":"2026-09-01","title":"First day of school","cal":"school","allDay":true,"who":["M"]},{"date":"2026-09-02","title":"Dentist — Mila","cal":"house","start":"14:30","end":"15:15","who":["S","M"]},{"date":"2026-09-03","title":"Parents’ evening","cal":"school","start":"19:30","end":"21:00","who":["E","S"]},{"date":"2026-09-04","title":"Bins out","cal":"house","allDay":true,"who":["E"]},{"date":"2026-09-04","title":"Swimming lesson","cal":"school","start":"16:00","end":"16:45","who":["M"]},{"date":"2026-09-14","title":"Sanne away — Berlin","cal":"house","allDay":true,"who":["S"]},{"date":"2026-09-19","title":"Grandad’s birthday","cal":"house","start":"15:00","who":["E","S","M"]},{"date":"2026-09-23","title":"Report meeting","cal":"school","start":"17:00","end":"17:20","who":["E"]},{"date":"2026-09-26","title":"Big shop","cal":"house","allDay":true,"who":["E"]}];
const CAL = {"house":{"name":"Household","fg":"#8a6a33","bg":"#f2ece0"},"school":{"name":"School","fg":"#2b7f86","bg":"#e2f2f0"},"work":{"name":"Work","fg":"#7d3f5f","bg":"#f0e6ec"}};
const MEM = {"E":"Eric","S":"Sanne","M":"Mila"};
const WEEKS = [[null,"2026-09-01","2026-09-02","2026-09-03","2026-09-04","2026-09-05","2026-09-06"],["2026-09-07","2026-09-08","2026-09-09","2026-09-10","2026-09-11","2026-09-12","2026-09-13"],["2026-09-14","2026-09-15","2026-09-16","2026-09-17","2026-09-18","2026-09-19","2026-09-20"],["2026-09-21","2026-09-22","2026-09-23","2026-09-24","2026-09-25","2026-09-26","2026-09-27"],["2026-09-28","2026-09-29","2026-09-30",null,null,null,null]];
const TODAY = '2026-09-02';
const num = (iso) => Number(iso.slice(8));
const on = (iso) => EVENTS.filter((e) => e.date === iso);
const timeOf = (e) => (e.allDay ? 'all-day' : e.end ? e.start + '\u2013' + e.end : e.start);
const longDate = (iso) => new Date(Number(iso.slice(0,4)), Number(iso.slice(5,7)) - 1, num(iso))
  .toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
const MONTHS = ['August 2026', 'September 2026', 'October 2026'];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { month: 1, sel: TODAY };
  }
  renderVals() {
    const here = this.state.month === 1;
    const sel = this.state.sel;
    const cells = WEEKS.flat().map((iso, i) => {
      if (!here || iso === null) {
        return { key: 'e' + i, num: '', style: 'height: 52px;', numStyle: 'display: none;', dots: [], pick: () => {} };
      }
      const isSel = iso === sel;
      const isToday = iso === TODAY;
      const evs = on(iso);
      return {
        key: iso,
        num: String(num(iso)),
        style: 'height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer; border-radius: 12px;' + (isSel ? ' background: #8a6a33;' : ''),
        numStyle: 'font-size: 16.5px; letter-spacing: -0.2px; width: 27px; height: 27px; display: flex; align-items: center; justify-content: center; border-radius: 999px;'
          + (isSel ? ' color: #ffffff; font-weight: 700;'
            : isToday ? ' color: #ffffff; background: #8a6a33; font-weight: 700;'
            : ' color: #1f2421;'),
        dots: evs.slice(0, 3).map((e, j) => ({
          key: iso + j,
          style: 'width: 6px; height: 6px; border-radius: 999px; flex: none; background: ' + (isSel ? '#ffffff' : CAL[e.cal].fg) + ';',
        })),
        pick: () => this.setState({ sel: iso }),
      };
    });
    const evs = here ? on(sel) : [];
    return {
      monthName: MONTHS[this.state.month],
      cells,
      dayLabel: here ? longDate(sel) : '\u2014',
      empty: evs.length === 0,
      events: evs.map((e, i) => ({
        key: i,
        title: e.title,
        time: timeOf(e),
        bar: 'width: 3px; align-self: stretch; margin: 10px 0; border-radius: 2px; flex: none; background: ' + CAL[e.cal].fg + ';',
        who: e.who.map((k) => ({ key: k, text: k, style: 'width: 21px; height: 21px; border-radius: 999px; background: #ffffff; border: 1.4px solid ' + CAL[e.cal].fg + '; color: ' + CAL[e.cal].fg + '; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex: none;' })),
      })),
      prev: () => this.setState({ month: Math.max(0, this.state.month - 1) }),
      next: () => this.setState({ month: Math.min(2, this.state.month + 1) }),
      today: () => this.setState({ month: 1, sel: TODAY }),
    };
  }
}
</script>
</body>
</html>
