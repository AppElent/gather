<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { title: '', pane: 'none' };
  }
  renderVals() {
    const has = this.state.title.trim().length > 0;
    return {
      card: 'position: absolute; left: 10px; right: 10px; background: #ffffff; border-radius: 26px; box-shadow: 0 8px 30px rgba(31, 36, 33, 0.20); padding: 20px 18px 16px; display: flex; flex-direction: column; gap: 16px; bottom: ' + (this.state.pane === 'date' ? '44px;' : '346px;'),
      commit: 'width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex: none; transition: background 120ms; background: ' + (has ? '#8a6a33' : '#d9dbd7') + ';',
      date: this.state.pane === 'date',
      extra: this.state.pane === 'extra',
      dateChip: 'display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 15px; border-radius: 999px; font-size: 15px; font-weight: 600; white-space: nowrap; flex: none; cursor: pointer; border: 1px solid transparent; background: '
        + (this.state.pane === 'date' ? '#8a6a33; color: #ffffff;' : '#f2ece0; color: #8a6a33;'),
      onTitle: (e) => this.setState({ title: e.target.value }),
      openDate: () => this.setState({ pane: this.state.pane === 'date' ? 'none' : 'date' }),
      openExtra: () => this.setState({ pane: this.state.pane === 'extra' ? 'none' : 'extra' }),
      close: () => this.setState({ pane: 'none' }),
    };
  }
}
</script>
