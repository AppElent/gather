# App Store screenshots (APP-234). Run by developer-home
# scripts/store-screenshots.mjs, which sets the language, status bar and
# appearance, launches the dev client against Metro, and passes the L_* labels
# for the language with -e (.maestro/store-screenshots.json). Screenshots land
# in --test-output-dir.
#
# Start the run with EXPO_PUBLIC_LIVE_MODULES_ONLY=1 so the dev client shows
# what the store build shows: Modules live on the phone only
# (src/modules/buildModules.ts). Only those Modules are visited here. The dev account signs in through the
# dev shortcut; a reinstall keeps the Clerk session in the keychain, so the
# shortcut is tapped only when the welcome screen is up. Nothing on these
# screens may show an email address or a dev label.
appId: com.appelent.gather.dev
---
- extendedWaitUntil:
    visible:
      id: "welcome-dev-sign-in|home-settings"
    timeout: 90000
- runFlow:
    when:
      visible:
        id: welcome-dev-sign-in
    commands:
      - tapOn:
          id: welcome-dev-sign-in
- extendedWaitUntil:
    visible:
      id: home-settings
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 01-home

- tapOn: ${L_ALL}
- extendedWaitUntil:
    visible:
      id: "all-row-.*-recipes"
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 02-all

- tapOn:
    id: "all-row-.*-recipes"
- extendedWaitUntil:
    visible: ${L_RECIPES}
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 03-recipes

- runFlow: back-to-all.yaml
- tapOn:
    id: "all-row-.*-tasks"
- extendedWaitUntil:
    visible:
      id: new-list
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 04-tasks

- runFlow: back-to-all.yaml
- scrollUntilVisible:
    element:
      id: "all-row-.*-wines"
    centerElement: true
- tapOn:
    id: "all-row-.*-wines"
- extendedWaitUntil:
    visible: ${L_WINES}
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 05-wines

- runFlow: back-to-all.yaml
- scrollUntilVisible:
    element:
      id: "all-row-.*-loyalty-cards"
    centerElement: true
- tapOn:
    id: "all-row-.*-loyalty-cards"
- extendedWaitUntil:
    visible: ${L_LOYALTY_CARDS}
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 06-loyalty-cards
