<!-- Same mark as favicon.svg, but full-bleed: Android crops a maskable icon to
     a shape it chooses, so the corners must be painted, not rounded away. The
     glyph reaches 156px from centre (r=128 plus half the 56px stroke), inside
     the 204.8px safe-zone radius. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="gather">
  <title>gather</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fb8b2" />
      <stop offset="1" stop-color="#2f6a4a" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#tile)" />
  <path
    d="M342 161 A128 128 0 1 0 380 286 L286 286"
    fill="none"
    stroke="#f3faf5"
    stroke-width="56"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
