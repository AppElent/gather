packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 auto-installs before running any script when node_modules looks
# stale. That is convenient locally and was fatal on EAS Build: EAS used to
# authenticate to the private @appelent scope from an `eas-build-pre-install`
# hook, and the auto-install fired *before* the hook body, so the install that
# needed the token ran without one. Under pnpm 11.8 the resulting 401 is then
# reported as ERR_PNPM_TARBALL_URL_MISMATCH — it accuses the lockfile of
# tampering rather than naming the auth failure (pnpm/pnpm#12489, fixed in 11.9).
# The private scope and the hook are gone (October 2026), so that failure can no
# longer happen. Retire this once one EAS iOS build has gone green with it
# removed. Until then, `pnpm run <script>` does not install for you when
# dependencies are stale — run `pnpm install` yourself.
verifyDepsBeforeRun: false

# pnpm 11 default-denies install/build lifecycle scripts (neutralizes the
# postinstall-RCE vector supply-chain worms rely on). Only packages that
# genuinely compile/download a native binary are allowed to run scripts;
# everything else (e.g. @clerk/shared's telemetry notice) stays denied.
allowBuilds:
  esbuild: true # native binary compile (bundler)
  lightningcss: true # native binary compile (Tailwind v4 oxide/CSS transform)
  sharp: true # native binary compile (libvips image processing)
  workerd: true # downloads the Cloudflare Workers runtime binary
  "@sentry/cli": true # downloads the sentry-cli binary, needed for sourcemap upload
  "@clerk/shared": false # postinstall is just a telemetry notice
  core-js: false # postinstall is just a sponsorship notice, no native binary (pulled in by jspdf's html2canvas dep)
  browser-tabs-lock: false # postinstall just prints a SuperTokens plug, no native binary (pulled in by @clerk/expo)
  bufferutil: false # optional native speed-up for `ws`; it falls back to JS without it
  utf-8-validate: false # ditto — optional native `ws` accelerator, not needed to run
  dtrace-provider: false # optional native tracing; EAS CLI runs without it
  node-datachannel: true # installs the native WebRTC binary used by Expo Device Hub
  lefthook: true # postinstall installs the git hooks from lefthook.yml
  protobufjs: false # postinstall only warns about version schemes, no native binary (pulled in by eas-cli via centrifuge); drop when eas-cli no longer depends on it

minimumReleaseAge: 4320 # 3 days — blocks the worm/account-takeover window

overrides:
  # convex lists the deprecated @clerk/clerk-react as an optional peer next to
  # @clerk/react, and pnpm auto-installs optional peers. The web is on
  # @clerk/react (Clerk Core 3), so keep the old package out of the graph.
  "convex>@clerk/clerk-react": "-"
  # APP-79: solid-js <1.9.18 pins seroval ~1.5.x (critical/high Dependabot
  # alerts GHSA-p6vx-979v-rg4c, GHSA-jp82-f5mq-hwhp, GHSA-97r2-qh9m-474h and
  # friends; fixed in seroval 1.6.10+). It reaches us only through the TanStack
  # devtools (@tanstack/react-devtools > @tanstack/devtools ^1.9.13), whose range
  # already allows 1.9.18 but pnpm keeps the locked 1.9.15. Exact rather than
  # ^1.9.18: with 1.9.19 still inside minimumReleaseAge, a range left 1.9.15 in
  # place. Remove once the lockfile resolves solid-js >=1.9.18 without this entry.
  "solid-js@<1.9.18": "1.9.18"

# @clerk/expo's config plugin imports @expo/config-plugins at runtime but only
# declares it as a devDependency. EAS loads the plugin without pnpm's NODE_PATH
# shim, so the build fails to read app.json without this.
packageExtensions:
  "@clerk/expo@^4.10.1":
    dependencies:
      "@expo/config-plugins": "~58.0.11"

# pnpm truncates the names of directories inside node_modules/.pnpm, and the
# default length is platform-dependent: 60 on Windows (MAX_PATH), 120 on Linux
# and macOS. Those directory names are hashed into `expo-updates`' fingerprint
# runtime version (ADR 0029) — 311 of the mobile app's 316 fingerprint sources
# are paths under .pnpm — so the same commit produced one runtime version on
# this Windows machine and a different one on the EAS Linux builder, and the
# build refused to configure EAS Update. Pinning the length makes the two
# agree. 60 rather than 120 because Windows cannot go higher.
# Retire this when @expo/fingerprint stops hashing virtual-store paths.
virtualStoreDirMaxLength: 60
