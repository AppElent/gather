packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 auto-installs before running any script when node_modules looks
# stale. That is convenient locally and fatal on EAS Build: EAS authenticates
# to our private @appelent scope from an `eas-build-pre-install` hook, and the
# auto-install fires *before* the hook body, so the install that needs the
# token runs without one. Under pnpm 11.8 the resulting 401 is then reported as
# ERR_PNPM_TARBALL_URL_MISMATCH — it accuses the lockfile of tampering rather
# than naming the auth failure (pnpm/pnpm#12489, fixed in 11.9).
# Retire this when the pin reaches 11.9+ *and* EAS auth no longer depends on a
# pre-install hook; until both hold, turning it off is what makes iOS builds
# possible at all. The cost is that `pnpm run <script>` no longer installs for
# you when dependencies are stale — run `pnpm install` yourself.
verifyDepsBeforeRun: false

# pnpm 11 default-denies install/build lifecycle scripts (neutralizes the
# postinstall-RCE vector supply-chain worms rely on). Only packages that
# genuinely compile/download a native binary are allowed to run scripts;
# everything else (e.g. @clerk/shared's telemetry notice, @google/genai's
# and protobufjs's postinstall) stays denied.
allowBuilds:
  esbuild: true # native binary compile (bundler)
  lightningcss: true # native binary compile (Tailwind v4 oxide/CSS transform)
  sharp: true # native binary compile (libvips image processing)
  workerd: true # downloads the Cloudflare Workers runtime binary
  "@sentry/cli": true # downloads the sentry-cli binary, needed for sourcemap upload
  "@clerk/shared": false # postinstall is just a telemetry notice
  "@google/genai": false # no native binary needed at install time
  protobufjs: false # no native binary needed at install time
  unrs-resolver: true # native binary resolver (napi-postinstall picks the platform build)
  core-js: false # postinstall is just a sponsorship notice, no native binary (pulled in by jspdf's html2canvas dep)
  browser-tabs-lock: false # postinstall just prints a SuperTokens plug, no native binary (pulled in by @clerk/expo)
  bufferutil: false # optional native speed-up for `ws`; it falls back to JS without it
  utf-8-validate: false # ditto — optional native `ws` accelerator, not needed to run
  dtrace-provider: false # optional native tracing; EAS CLI runs without it

minimumReleaseAge: 4320 # 3 days — blocks the worm/account-takeover window
minimumReleaseAgeExclude:
  - "@appelent/*" # our own registry, always trusted

overrides:
  # @tanstack/ai-gemini pulls in @google/genai@^2.8.0, which latest-resolved to
  # 2.11.0 (published within the minimumReleaseAge cooldown). Pin to 2.10.0
  # (published 2026-06-24, outside the cooldown) instead of weakening the policy.
  "@google/genai": "2.10.0"
