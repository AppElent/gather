<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Agenda root en instellingen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font:inherit;border:0;background:none;padding:0;cursor:pointer;color:inherit;text-align:left}
svg{flex:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{c.ground}}; font-family: -apple-system, 'SF Pro Text', system-ui, 'Helvetica Neue', Arial, sans-serif; color: {{c.ink}}">

  <div style="height: 54px"></div>

  <!-- Native bar (A, B, settings) -->
  <sc-if value="{{nativeBar}}" hint-placeholder-val="{{ true }}">
    <div style="height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; box-sizing: border-box; position: relative">
      <button aria-label="Terug" style="width: 44px; height: 44px; border-radius: 999px; background: {{c.glass}}; border: 0.5px solid {{c.hair}}; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </button>
      <span style="position: absolute; left: 80px; right: 120px; text-align: center; font-size: 17px; line-height: 22px; font-weight: 600">{{inlineTitle}}</span>
      <div style="display: flex; gap: 8px">
        <sc-if value="{{rootBar}}" hint-placeholder-val="{{ true }}">
          <button aria-label="Zoeken in Agenda" style="width: 44px; height: 44px; border-radius: 999px; background: {{c.glass}}; border: 0.5px solid {{c.hair}}; display: flex; align-items: center; justify-content: center">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          </button>
        </sc-if>
        <sc-if value="{{gearInBar}}" hint-placeholder-val="{{ true }}">
          <a href="K627-2-Instellingen.dc.html" aria-label="Instellingen van Agenda" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 999px; background: {{c.glass}}; border: 0.5px solid {{c.hair}}; display: flex; align-items: center; justify-content: center">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
          </a>
        </sc-if>
        <sc-if value="{{moreInBar}}" hint-placeholder-val="{{ false }}">
          <button aria-label="Weergave en meer" style="width: 44px; height: 44px; border-radius: 999px; background: {{c.glass}}; border: 0.5px solid {{c.hair}}; display: flex; align-items: center; justify-content: center">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="{{c.ink}}" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
          </button>
        </sc-if>
      </div>
    </div>
  </sc-if>

  <!-- Own toolbar (now and C) -->
  <sc-if value="{{ownBar}}" hint-placeholder-val="{{ false }}">
    <div style="min-height: 54px; display: flex; align-items: center; gap: 8px; padding: 0 12px; box-sizing: border-box">
      <button style="min-width: 54px; min-height: 44px; font-size: 17px; font-weight: 600; color: {{c.accentText}}">Vandaag</button>
      <span style="flex-grow: 1; font-family: 'SF Pro Rounded', ui-rounded, Nunito, system-ui, sans-serif; font-size: 22px; font-weight: 700">November 2026</span>
      <button aria-label="Zoeken in Agenda" style="width: 40px; height: 40px; border-radius: 999px; background: {{c.surface2}}; display: flex; align-items: center; justify-content: center">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      </button>
      <sc-if value="{{gearInOwn}}" hint-placeholder-val="{{ false }}">
        <button aria-label="Instellingen van Agenda" style="width: 40px; height: 40px; border-radius: 999px; background: {{c.surface2}}; display: flex; align-items: center; justify-content: center">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"></path></svg>
        </button>
      </sc-if>
      <button aria-label="Weergave en meer" style="width: 40px; height: 40px; border-radius: 999px; background: {{c.surface2}}; display: flex; align-items: center; justify-content: center">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="{{c.ink}}" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
      </button>
    </div>
  </sc-if>

  <!-- A: Vandaag + view switch under the native bar -->
  <sc-if value="{{viewRow}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; align-items: center; gap: 10px; padding: 6px 16px 4px">
      <button style="min-height: 36px; padding: 0 14px; border-radius: 999px; background: {{c.surface}}; border: 1px solid {{c.hair}}; font-size: 15px; font-weight: 600; color: {{c.accentText}}">Vandaag</button>
      <div role="radiogroup" aria-label="Weergave" style="flex-grow: 1; display: flex; height: 36px; padding: 2px; box-sizing: border-box; border-radius: 999px; background: {{c.surface2}}">
        <sc-for list="{{views}}" as="v" hint-placeholder-count="3">
          <button role="radio" aria-checked="{{v.on}}" style="flex: 1; border-radius: 999px; text-align: center; font-size: 14px; font-weight: 600; background: {{v.bg}}; color: {{v.fg}}; box-shadow: {{v.shadow}}">{{v.label}}</button>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <!-- Week strip + agenda (all roots) -->
  <sc-if value="{{isRoot}}" hint-placeholder-val="{{ true }}">
    <div>
      <div style="display: flex; align-items: center; padding: 6px 4px 0">
        <span style="width: 28px; text-align: center; font-size: 22px; color: {{c.accentText}}">‹</span>
        <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px">
          <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0">
              <span style="font-size: 11px; font-weight: 600; color: {{c.muted}}">{{d.wd}}</span>
              <span style="width: 34px; height: 34px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; background: {{d.bg}}; color: {{d.fg}}">{{d.n}}</span>
              <span style="width: 5px; height: 5px; border-radius: 999px; background: {{d.dot}}"></span>
            </div>
          </sc-for>
        </div>
        <span style="width: 28px; text-align: center; font-size: 22px; color: {{c.accentText}}">›</span>
      </div>
      <div style="display: flex; justify-content: center; padding: 6px 0 8px"><span style="width: 36px; height: 5px; border-radius: 999px; background: {{c.hair}}"></span></div>
      <sc-if value="{{filterStatus}}" hint-placeholder-val="{{ false }}">
        <div style="padding: 0 20px 8px; font-size: 13px; font-weight: 600; color: {{c.accentText}}">Filters actief · 1 agenda verborgen</div>
      </sc-if>
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 16px">
        <sc-for list="{{agenda}}" as="g" hint-placeholder-count="2">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <h2 style="margin: 4px 0 0; padding: 0 4px; font-size: 13px; line-height: 18px; font-weight: 600; color: {{c.muted}}">{{g.head}}</h2>
            <div style="background: {{c.surface}}; border-radius: 16px; overflow: hidden">
              <sc-for list="{{g.rows}}" as="e" hint-placeholder-count="2">
                <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 14px; box-sizing: border-box; border-top: {{e.line}}">
                  <span aria-hidden="true" style="width: 4px; align-self: stretch; border-radius: 2px; background: {{e.color}}"></span>
                  <div style="flex-grow: 1; display: flex; flex-direction: column">
                    <span style="font-size: 17px; line-height: 22px">{{e.title}}</span>
                    <span style="font-size: 13px; line-height: 18px; color: {{c.muted}}">{{e.meta}}</span>
                  </div>
                  <span style="font-size: 15px; color: {{c.muted}}; font-variant-numeric: tabular-nums">{{e.time}}</span>
                </div>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
    <button aria-label="Afspraak toevoegen" style="position: absolute; right: 20px; bottom: 104px; width: 56px; height: 56px; border-radius: 999px; background: {{c.fab}}; box-shadow: 0 6px 20px rgba(0,0,0,.18); display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{c.fabOn}}" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </sc-if>

  <!-- B: the ⋯ menu open -->
  <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
    <div role="menu" aria-label="Weergave en meer" style="position: absolute; right: 16px; top: 104px; width: 250px; border-radius: 14px; background: {{c.menu}}; box-shadow: 0 18px 48px rgba(0,0,0,.25); overflow: hidden">
      <sc-for list="{{menu}}" as="m" hint-placeholder-count="6">
        <div role="menuitem" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; border-top: {{m.line}}; font-size: 17px">
          <span style="width: 16px; font-weight: 700; color: {{c.ink}}">{{m.check}}</span><span>{{m.label}}</span>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <!-- Settings page -->
  <sc-if value="{{isSettings}}" hint-placeholder-val="{{ false }}">
    <h1 style="margin: 0; padding: 4px 16px 10px 16px; font-family: 'SF Pro Rounded', ui-rounded, Nunito, system-ui, sans-serif; font-size: 34px; line-height: 41px; font-weight: 700">Agenda-instellingen</h1>
    <div style="display: flex; flex-direction: column; gap: 22px; padding: 0 16px">
      <sc-for list="{{sections}}" as="s" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <h2 style="margin: 0; padding: 0 4px; font-size: 13px; line-height: 18px; font-weight: 600; color: {{c.muted}}">{{s.head}}</h2>
          <div style="background: {{c.surface}}; border-radius: 16px; overflow: hidden">
            <sc-for list="{{s.rows}}" as="r" hint-placeholder-count="2">
              <div style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 14px; box-sizing: border-box; border-top: {{r.line}}">
                <sc-if value="{{r.hasDot}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 999px; background: {{r.dot}}"></span></sc-if>
                <span style="flex-grow: 1; font-size: 17px; line-height: 22px; color: {{r.ink}}">{{r.label}}</span>
                <sc-if value="{{r.isToggle}}" hint-placeholder-val="{{ false }}">
                  <span role="switch" aria-checked="{{r.on}}" aria-label="{{r.label}} tonen" style="width: 51px; height: 31px; border-radius: 999px; background: {{r.track}}; position: relative; display: block">
                    <span aria-hidden="true" style="position: absolute; top: 2px; left: {{r.knob}}px; width: 27px; height: 27px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 2px 4px rgba(0,0,0,.2)"></span>
                  </span>
                </sc-if>
                <sc-if value="{{r.isValue}}" hint-placeholder-val="{{ true }}">
                  <span style="font-size: 17px; line-height: 22px; color: {{c.muted}}">{{r.value}}</span>
                </sc-if>
              </div>
            </sc-for>
          </div>
          <sc-if value="{{s.hasFoot}}" hint-placeholder-val="{{ false }}">
            <p style="margin: 0; padding: 0 4px; font-size: 13px; line-height: 18px; color: {{c.muted}}">{{s.foot}}</p>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <!-- Tab bar -->
  <nav aria-label="Tabbladen" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: {{c.glass}}; border-top: 0.5px solid {{c.hair}}; display: flex; justify-content: space-around; padding-top: 8px; box-sizing: border-box">
    <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="5">
      <a href="#" aria-label="{{tab.label}}" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: {{tab.color}}; font-size: 10px; line-height: 12px; font-weight: 600">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{tab.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{tab.icon}}"></path></svg>
        <span>{{tab.label}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"screen":{"editor":"enum","options":["now","A","B","C","settings"],"default":"A"},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const screen = this.props.screen ?? 'A';
    const dark = (this.props.theme ?? 'light') === 'dark';
    const c = dark ? {
      ground: '#0F1110', surface: '#1B1E1D', surface2: '#262A28', ink: '#F1F3F1', muted: '#A0A8A4', hair: '#2E3331', glass: 'rgba(38,42,40,.92)', menu: '#262A28',
      accentText: '#E9B44C', chipOn: '#F1F3F1', chipOnText: '#0F1110', track: '#30D158', trackOff: '#3A3F3D', fab: '#E9B44C', fabOn: '#2B1F06', today: '#E9B44C', todayOn: '#2B1F06',
      cal1: '#E9B44C', cal2: '#4FB3AC', cal3: '#B28BF0'
    } : {
      ground: '#F2F3F1', surface: '#FFFFFF', surface2: '#E7E9E5', ink: '#1A1F1D', muted: '#5E6764', hair: '#DFE2DE', glass: 'rgba(255,255,255,.92)', menu: 'rgba(255,255,255,.97)',
      accentText: '#8A5A00', chipOn: '#1A1F1D', chipOnText: '#FFFFFF', track: '#34C759', trackOff: '#E3E5E2', fab: '#F2B233', fabOn: '#2B1F06', today: '#1A1F1D', todayOn: '#FFFFFF',
      cal1: '#D99B2B', cal2: '#0B7C75', cal3: '#7B4FC9'
    };
    const line = (i) => (i === 0 ? '0' : '0.5px solid ' + c.hair);
    const isSettings = screen === 'settings';
    const isRoot = !isSettings;
    const nativeBar = screen === 'A' || screen === 'B' || isSettings;
    const wd = ['MA','DI','WO','DO','VR','ZA','ZO'];
    const days = [17,18,19,20,21,22,23].map((n, i) => ({ wd: wd[i], n: String(n), bg: n === 23 ? c.today : 'transparent', fg: n === 23 ? c.todayOn : c.ink, dot: [17,19,21,23].includes(n) ? c.muted : 'transparent' }));
    const ev = (title, meta, time, color) => ({ title, meta, time, color });
    const withLines = (rows) => rows.map((r, i) => ({ ...r, line: line(i) }));
    const agenda = [
      { head: 'VANDAAG · ZONDAG 23 NOVEMBER', rows: withLines([ev('Zwemles Sam', 'Gezin · Sam', '09:30', c.cal1), ev('Oma op bezoek', 'Gezin · iedereen', '15:00', c.cal1)]) },
      { head: 'MAANDAG 24 NOVEMBER', rows: withLines([ev('Tandarts', 'Eric', '08:45', c.cal2), ev('Ophalen pakket', 'Werk', '17:30', c.cal3)]) }
    ];
    const viewDefs = [['Maand', false], ['Week', true], ['Agenda', false]];
    const views = viewDefs.map(([label, on]) => ({ label, on: on ? 'true' : 'false', bg: on ? c.surface : 'transparent', fg: on ? c.ink : c.muted, shadow: on ? '0 1px 3px rgba(0,0,0,.12)' : 'none' }));
    const menu = [
      { check: '', label: 'Maand' }, { check: '✓', label: 'Week + agenda' }, { check: '', label: 'Agenda' },
      { check: '', label: 'Agenda’s…' }, { check: '', label: 'Personen…' }, { check: '', label: 'Agenda-instellingen' }
    ].map((m, i) => ({ ...m, line: line(i) }));
    const toggle = (label, on, dot) => ({ label, isToggle: true, isValue: false, hasDot: !!dot, dot, ink: c.ink, on: on ? 'true' : 'false', track: on ? c.track : c.trackOff, knob: on ? 22 : 2 });
    const value = (label, v) => ({ label, isToggle: false, isValue: true, hasDot: false, value: v, ink: c.ink });
    const action = (label) => ({ label, isToggle: false, isValue: false, hasDot: false, ink: c.accentText });
    const sec = (s) => ({ ...s, rows: s.rows.map((r, i) => ({ ...r, line: line(i) })), hasFoot: !!s.foot });
    const sections = [
      { head: 'WEERGAVE', rows: [value('Opent in', 'Week + agenda ›')], foot: 'De weergave die je in de agenda kiest, onthoudt hij ook.' },
      { head: 'AGENDA’S', rows: [toggle('Gezin', true, c.cal1), toggle('Eric', true, c.cal2), toggle('Werk', false, c.cal3), action('Agenda’s beheren…')] },
      { head: 'PERSONEN', rows: [value('Afspraken van', 'Iedereen ›')], foot: 'Deze keuzes gelden alleen voor jou, in Familie Jansen. Agenda’s en afspraken deel je met je groep.' }
    ].map(sec);
    const icons = {
      home: 'M3 11l9-8 9 8M5 10v10h14V10', grid: 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z', plus: 'M12 5v14M5 12h14',
      search: 'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-3.5-3.5', gear: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1'
    };
    const tabs = [['Home', icons.home], ['Alles', icons.grid], ['Nieuw', icons.plus], ['Zoeken', icons.search], ['Instellingen', icons.gear]].map(([label, icon]) => ({ label, icon, color: label === 'Alles' ? c.ink : c.muted }));
    return {
      c, days, agenda, views, menu, sections, tabs,
      nativeBar, ownBar: screen === 'now' || screen === 'C',
      rootBar: screen === 'A' || screen === 'B',
      gearInBar: screen === 'A', moreInBar: screen === 'B', gearInOwn: screen === 'C',
      viewRow: screen === 'A', isRoot, isSettings,
      menuOpen: screen === 'B', filterStatus: false,
      inlineTitle: isSettings ? '' : 'November 2026'
    };
  }
}
</script>
</body>
</html>
