<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Notities, web</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font:inherit;border:0;background:none;padding:0;cursor:pointer;color:inherit;text-align:left}
a{text-decoration:none;color:inherit}
svg{flex:none}
</style>
</helmet>
<div style="width: 1280px; height: 800px; overflow: hidden; display: flex; background: {{c.ground}}; font-family: -apple-system, 'SF Pro Text', system-ui, 'Helvetica Neue', Arial, sans-serif; color: {{c.ink}}">
  <aside aria-label="{{t.list}}" style="width: 340px; flex: none; box-sizing: border-box; padding: 20px 16px; border-right: 1px solid {{c.hair}}; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-family: 'SF Pro Rounded', ui-rounded, Nunito, system-ui, sans-serif; font-size: 26px; font-weight: 700">{{t.title}}</h1>
      <button style="height: 36px; padding: 0 14px; border-radius: 999px; background: {{c.accent}}; color: {{c.onAccent}}; font-weight: 700">{{t.new}}</button>
    </div>
    <span style="height: 38px; border-radius: 12px; background: {{c.surface2}}; display: flex; align-items: center; padding: 0 12px; color: {{c.muted}}; font-size: 15px">{{t.search}}</span>
    <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
      <sc-for list="{{notes}}" as="n" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 12px; background: {{n.bg}}">
          <span style="font-size: 15px; font-weight: 600">{{n.title}}</span>
          <span style="font-size: 13px; color: {{n.subColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.sub}}</span>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: {{c.trashBg}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg>
      <span style="flex-grow: 1; font-size: 15px; font-weight: {{c.trashWeight}}">{{t.trash}}</span>
      <span style="font-size: 13px; color: {{c.muted}}">3</span>
    </div>
  </aside>

  <main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
    <sc-if value="{{isNote}}" hint-placeholder-val="{{ true }}">
      <div role="toolbar" aria-label="{{t.format}}" style="display: flex; align-items: center; gap: 4px; padding: 10px 24px; border-bottom: 1px solid {{c.hair}}; flex-wrap: wrap">
        <sc-for list="{{tools}}" as="tool" hint-placeholder-count="8">
          <button aria-label="{{tool.label}}" aria-pressed="{{tool.on}}" style="min-width: 36px; height: 36px; padding: 0 8px; box-sizing: border-box; border-radius: 9px; display: flex; align-items: center; justify-content: center; gap: 6px; background: {{tool.bg}}; color: {{tool.fg}}; font-size: 15px; font-weight: {{tool.weight}}; font-style: {{tool.style}}">{{tool.text}}</button>
        </sc-for>
        <span style="flex-grow: 1"></span>
        <span style="font-size: 13px; color: {{c.muted}}">{{t.saved}}</span>
      </div>
      <article style="max-width: 680px; padding: 28px 40px; display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; font-family: 'SF Pro Rounded', ui-rounded, Nunito, system-ui, sans-serif; font-size: 32px; font-weight: 700">{{t.noteTitle}}</h2>
        <span style="font-size: 13px; color: {{c.muted}}">{{t.meta}}</span>
        <p style="margin: 6px 0 0; font-size: 17px; line-height: 26px">{{t.p1}}<strong>{{t.p1b}}</strong>{{t.p1c}}<a href="#" style="color: {{c.accentText}}; text-decoration: underline">{{t.link}}</a></p>
        <div role="img" aria-label="{{t.photoAlt}}" style="height: 220px; border-radius: 16px; background: {{c.photo}}; display: flex; align-items: flex-end; padding: 10px; box-sizing: border-box"><span style="padding: 3px 8px; border-radius: 999px; background: rgba(0,0,0,.45); color: #FFFFFF; font-size: 12px; font-weight: 600">{{t.photo}}</span></div>
        <h3 style="margin: 10px 0 0; font-size: 20px; font-weight: 700">{{t.h}}</h3>
        <sc-for list="{{todos}}" as="td" hint-placeholder-count="3">
          <div style="display: flex; gap: 10px; align-items: center; font-size: 17px; line-height: 26px">
            <span role="checkbox" aria-checked="{{td.on}}" aria-label="{{td.text}}" style="width: 20px; height: 20px; border-radius: 6px; box-sizing: border-box; border: 2px solid {{td.ring}}; background: {{td.fill}}"></span>
            <span style="color: {{td.fg}}; text-decoration: {{td.strike}}">{{td.text}}</span>
          </div>
        </sc-for>
      </article>
    </sc-if>
    <sc-if value="{{isDeleted}}" hint-placeholder-val="{{ false }}">
      <div style="padding: 28px 40px; display: flex; flex-direction: column; gap: 14px; max-width: 760px">
        <h2 style="margin: 0; font-family: 'SF Pro Rounded', ui-rounded, Nunito, system-ui, sans-serif; font-size: 32px; font-weight: 700">{{t.trash}}</h2>
        <p style="margin: 0; font-size: 15px; line-height: 21px; color: {{c.muted}}">{{t.trashSub}}</p>
        <div style="border-radius: 16px; background: {{c.surface}}; overflow: hidden">
          <sc-for list="{{deleted}}" as="d" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-top: {{d.line}}">
              <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 15px; font-weight: 600">{{d.title}}</span>
                <span style="font-size: 13px; color: {{d.subColor}}">{{d.sub}}</span>
              </div>
              <button style="height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid {{c.hairStrong}}; font-weight: 600; color: {{c.accentText}}">{{t.restore}}</button>
              <button style="height: 34px; padding: 0 14px; border-radius: 999px; font-weight: 600; color: {{c.danger}}">{{t.purge}}</button>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"screen":{"editor":"enum","options":["note","deleted"],"default":"note"},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"lang":{"editor":"enum","options":["nl","en"],"default":"nl"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const screen = this.props.screen ?? 'note';
    const dark = (this.props.theme ?? 'light') === 'dark';
    const en = (this.props.lang ?? 'nl') === 'en';
    const L = (nl, e) => (en ? e : nl);
    const c = dark ? { ground: '#0F1110', surface: '#1B1E1D', surface2: '#262A28', ink: '#F1F3F1', muted: '#A0A8A4', hair: '#2E3331', hairStrong: '#3A3F3D', danger: '#F0917F', accent: '#D99B2B', onAccent: '#2B1F06', accentText: '#F2C060', wash: '#2E2611', photo: '#3B4A44' }
      : { ground: '#F2F3F1', surface: '#FFFFFF', surface2: '#E9EBE8', ink: '#1A1F1D', muted: '#5E6764', hair: '#DFE2DE', hairStrong: '#C9CDC8', danger: '#A4372C', accent: '#F2B233', onAccent: '#2B1F06', accentText: '#8A5C08', wash: '#FBEBC6', photo: '#9DB3A6' };
    const isDeleted = screen === 'deleted';
    c.trashBg = isDeleted ? c.wash : 'transparent'; c.trashWeight = isDeleted ? 700 : 400;
    const t = {
      list: L('Notities', 'Notes'), title: L('Notities', 'Notes'), new: L('Nieuw', 'New'), search: L('Zoek in notities', 'Search notes'), trash: L('Recent verwijderd', 'Recently deleted'),
      format: L('Opmaak', 'Formatting'), saved: L('Bewaard', 'Saved'), noteTitle: L('Weekend Texel', 'Texel weekend'), meta: L('Familie Jansen · Anne, vandaag 10:12', 'Familie Jansen · Anne, today 10:12'),
      p1: L('Alles voor het ', 'Everything for the '), p1b: L('weekend op Texel', 'Texel weekend'), p1c: L('. Boot gaat vr 13 nov om 15:30, ', '. Ferry leaves Fri 13 Nov 15:30, '), link: L('tickets', 'tickets'),
      photo: L('Foto', 'Photo'), photoAlt: L('De boot naar Texel', 'The ferry to Texel'), h: L('Inpakken', 'Packing'),
      trashSub: L('Notities blijven hier 30 dagen en verdwijnen dan voorgoed. Iedereen in Familie Jansen ziet ze.', 'Notes stay here for 30 days, then they are gone for good. Everyone in Familie Jansen sees them.'),
      restore: L('Zet terug', 'Restore'), purge: L('Definitief verwijderen', 'Delete for good')
    };
    const sel = (i) => (!isDeleted && i === 1 ? c.wash : 'transparent');
    const notes = [
      [L('Wifi en codes', 'Wifi and codes'), L('Vastgezet · Gast: Jansen-gast', 'Pinned · Guest: Jansen-guest')],
      [L('Weekend Texel', 'Texel weekend'), L('vandaag · Alles voor het weekend op Texel…', 'today · Everything for the Texel weekend…')],
      [L('Cadeaus december', 'December presents'), L('wo · Sam: lego, Anne: boek…', 'Wed · Sam: lego, Anne: book…')],
      [L('Klusjes zolder', 'Attic jobs'), L('ma · Isolatie, kast ophangen', 'Mon · Insulation, hang cupboard')]
    ].map(([title, sub], i) => ({ title, sub, bg: sel(i), subColor: c.muted }));
    const tool = (label, text, o = {}) => ({ label, text, on: o.on ? 'true' : 'false', bg: o.on ? c.wash : 'transparent', fg: o.on ? c.accentText : c.ink, weight: o.weight ?? 600, style: o.style ?? 'normal' });
    const tools = [tool(L('Kop', 'Heading'), L('Kop', 'Heading')), tool(L('Vet', 'Bold'), 'B', { weight: 800 }), tool(L('Cursief', 'Italic'), 'I', { style: 'italic', weight: 500 }), tool(L('Lijst', 'Bullets'), '• ' + L('Lijst', 'List')), tool(L('Genummerd', 'Numbered'), '1. ' + L('Genummerd', 'Numbered')), tool(L('Afvinklijst', 'Checklist'), '☐ ' + L('Afvinken', 'Checklist'), { on: true }), tool(L('Link', 'Link'), L('Link', 'Link')), tool(L('Foto', 'Photo'), L('Foto', 'Photo'))];
    const todos = [[L('Regenjassen', 'Rain jackets'), true], [L('Zonnebrandcrème', 'Sunscreen'), false], [L('Opladers', 'Chargers'), false]].map(([text, on]) => ({ text, on: on ? 'true' : 'false', ring: on ? c.accent : c.muted, fill: on ? c.accent : 'transparent', fg: on ? c.muted : c.ink, strike: on ? 'line-through' : 'none' }));
    const deleted = [
      [L('Boodschappen oud', 'Old groceries'), L('Verwijderd door jou · nog 30 dagen', 'Deleted by you · 30 days left'), c.muted],
      [L('Notulen VvE', 'HOA minutes'), L('Verwijderd door Anne · nog 12 dagen', 'Deleted by Anne · 12 days left'), c.muted],
      [L('Ideeën tuin', 'Garden ideas'), L('Verwijderd door jou · nog 2 dagen', 'Deleted by you · 2 days left'), c.danger]
    ].map(([title, sub, subColor], i) => ({ title, sub, subColor, line: i === 0 ? '0' : '1px solid ' + c.hair }));
    return { c, t, notes, tools, todos, deleted, isNote: !isDeleted, isDeleted };
  }
}
</script>
</body>
</html>
