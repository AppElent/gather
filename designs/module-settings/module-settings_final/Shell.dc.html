<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Zoeken en module-instellingen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}a:hover{opacity:.8}
button{font:inherit;border:0;background:none;padding:0;cursor:pointer;color:inherit;text-align:left}
input{font:inherit;border:0;background:none;outline:none;color:inherit;padding:0;min-width:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{c.ground}}; font-family: -apple-system, 'SF Pro Text', system-ui, 'Helvetica Neue', Arial, sans-serif; color: {{c.ink}}">

  <div style="height: 54px"></div>

  <div style="height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; box-sizing: border-box">
    <div style="display: flex; gap: 8px">
      <sc-if value="{{showBack}}" hint-placeholder-val="{{ true }}">
        <button aria-label="Terug" style="width: 44px; height: 44px; border-radius: 999px; background: {{c.glass}}; border: 0.5px solid {{c.hair}}; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
        </button>
      </sc-if>
    </div>
    <span style="font-size: 17px; line-height: 22px; font-weight: 600">{{inlineTitle}}</span>
    <div style="display: flex; gap: 8px">
      <sc-if value="{{showSearchBtn}}" hint-placeholder-val="{{ true }}">
        <button aria-label="Zoeken in {{moduleName}}" style="width: 44px; height: 44px; border-radius: 999px; background: {{c.glass}}; border: 0.5px solid {{c.hair}}; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        </button>
      </sc-if>
      <sc-if value="{{showGear}}" hint-placeholder-val="{{ true }}">
        <button aria-label="Instellingen van {{moduleName}}" style="width: 44px; height: 44px; border-radius: 999px; background: {{c.glass}}; border: 0.5px solid {{c.hair}}; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
        </button>
      </sc-if>
    </div>
  </div>

  <sc-if value="{{showLargeTitle}}" hint-placeholder-val="{{ true }}">
    <h1 style="margin: 0; padding: 4px 16px 10px 16px; font-family: 'SF Pro Rounded', ui-rounded, Nunito, system-ui, sans-serif; font-size: 34px; line-height: 41px; font-weight: 700">{{largeTitle}}</h1>
  </sc-if>

  <sc-if value="{{isSearch}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column; gap: 14px">
      <div role="group" aria-label="Filters" style="display: flex; gap: 8px; padding: 0 16px; overflow-x: auto">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
          <button aria-label="{{f.aria}}" style="flex: 0 0 auto; min-height: 36px; padding: 0 14px; border-radius: 999px; display: flex; align-items: center; gap: 6px; font-size: 15px; line-height: 20px; font-weight: 600; background: {{f.bg}}; color: {{f.fg}}; border: 1px solid {{f.border}}">
            <span>{{f.label}}</span><span aria-hidden="true" style="font-size: 12px">{{f.mark}}</span>
          </button>
        </sc-for>
      </div>
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 16px">
          <sc-if value="{{g.showHead}}" hint-placeholder-val="{{ true }}">
            <h2 style="margin: 0; padding: 0 4px; font-size: 13px; line-height: 18px; font-weight: 600; color: {{c.muted}}">{{g.head}}</h2>
          </sc-if>
          <div style="background: {{c.surface}}; border-radius: 16px; overflow: hidden">
            <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="2">
              <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 14px; box-sizing: border-box; text-decoration: none; border-top: {{r.line}}">
                <div aria-hidden="true" style="width: 30px; height: 30px; flex: 0 0 auto; border-radius: 9px; background: {{g.fill}}; display: flex; align-items: center; justify-content: center">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{g.on}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{g.icon}}"></path></svg>
                </div>
                <div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0">
                  <span style="font-size: 17px; line-height: 22px; color: {{c.ink}}">{{r.title}}</span>
                  <span style="font-size: 13px; line-height: 18px; color: {{c.muted}}">{{r.meta}}</span>
                </div>
              </a>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{isModule}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 16px">
      <h2 style="margin: 0; padding: 0 4px; font-size: 13px; line-height: 18px; font-weight: 600; color: {{c.muted}}">VANDAAG</h2>
      <div style="background: {{c.surface}}; border-radius: 16px; overflow: hidden">
        <sc-for list="{{tasks}}" as="t" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 14px; box-sizing: border-box; border-top: {{t.line}}">
            <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 999px; border: 2px solid {{c.accentText}}; box-sizing: border-box"></span>
            <span style="flex-grow: 1; font-size: 17px; line-height: 22px">{{t.title}}</span>
            <span style="font-size: 13px; line-height: 18px; color: {{c.muted}}">{{t.meta}}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{isSettings}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 22px; padding: 0 16px">
      <sc-for list="{{sections}}" as="s" hint-placeholder-count="2">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <h2 style="margin: 0; padding: 0 4px; font-size: 13px; line-height: 18px; font-weight: 600; color: {{c.muted}}">{{s.head}}</h2>
          <div style="background: {{c.surface}}; border-radius: 16px; overflow: hidden">
            <sc-for list="{{s.rows}}" as="r" hint-placeholder-count="2">
              <div style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 14px; box-sizing: border-box; border-top: {{r.line}}">
                <span style="flex-grow: 1; font-size: 17px; line-height: 22px">{{r.label}}</span>
                <sc-if value="{{r.isToggle}}" hint-placeholder-val="{{ false }}">
                  <span role="switch" aria-checked="{{r.on}}" aria-label="{{r.label}}" style="width: 51px; height: 31px; border-radius: 999px; background: {{r.track}}; position: relative; display: block">
                    <span aria-hidden="true" style="position: absolute; top: 2px; left: {{r.knob}}px; width: 27px; height: 27px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 2px 4px rgba(0,0,0,.2)"></span>
                  </span>
                </sc-if>
                <sc-if value="{{r.isValue}}" hint-placeholder-val="{{ true }}">
                  <span style="font-size: 17px; line-height: 22px; color: {{c.muted}}">{{r.value}} ›</span>
                </sc-if>
              </div>
            </sc-for>
          </div>
          <sc-if value="{{s.hasFoot}}" hint-placeholder-val="{{ false }}">
            <p style="margin: 0; padding: 0 4px; font-size: 13px; line-height: 18px; color: {{c.muted}}">{{s.foot}}</p>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{showBar}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 12px; right: 12px; bottom: {{barBottom}}px; display: flex; gap: 8px; align-items: center">
      <label style="flex-grow: 1; height: 48px; border-radius: 999px; background: {{c.glass}}; border: 0.5px solid {{c.hair}}; box-shadow: 0 6px 20px rgba(0,0,0,.12); display: flex; align-items: center; gap: 8px; padding: 0 16px; box-sizing: border-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input aria-label="Zoeken" value="melk" style="flex-grow: 1; font-size: 17px">
      </label>
      <button aria-label="Annuleren" style="width: 48px; height: 48px; border-radius: 999px; background: {{c.glass}}; border: 0.5px solid {{c.hair}}; box-shadow: 0 6px 20px rgba(0,0,0,.12); display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
  </sc-if>

  <sc-if value="{{showKeyboard}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 300px; background: {{c.kb}}"></div>
  </sc-if>

  <sc-if value="{{showTabs}}" hint-placeholder-val="{{ true }}">
    <nav aria-label="Tabbladen" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: {{c.glass}}; border-top: 0.5px solid {{c.hair}}; display: flex; justify-content: space-around; padding-top: 8px; box-sizing: border-box">
      <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="5">
        <a href="#" aria-label="{{tab.label}}" style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: {{tab.color}}; font-size: 10px; line-height: 12px; font-weight: 600">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{tab.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{tab.icon}}"></path></svg>
          <span>{{tab.label}}</span>
        </a>
      </sc-for>
    </nav>
  </sc-if>

  <sc-if value="{{showSheet}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,.28)"></div>
    <section aria-label="Module kiezen" style="position: absolute; left: 0; right: 0; bottom: 0; background: {{c.ground}}; border-radius: 34px 34px 0 0; padding: 8px 16px 34px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
      <div aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 999px; background: {{c.hair}}"></div>
      <h2 style="margin: 0; font-family: 'SF Pro Rounded', ui-rounded, Nunito, system-ui, sans-serif; font-size: 22px; line-height: 28px; font-weight: 700">Zoeken in</h2>
      <div style="background: {{c.surface}}; border-radius: 16px; overflow: hidden">
        <sc-for list="{{moduleChoices}}" as="m" hint-placeholder-count="6">
          <button aria-pressed="{{m.selected}}" style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 14px; box-sizing: border-box; border-top: {{m.line}}">
            <span style="flex-grow: 1; font-size: 17px; line-height: 22px">{{m.label}}</span>
            <span aria-hidden="true" style="font-size: 17px; font-weight: 600; color: {{c.accentText}}">{{m.check}}</span>
          </button>
        </sc-for>
      </div>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"screen":{"editor":"enum","options":["search","searchModule","searchSheet","moduleRoot","moduleSettings","settingsTab"],"default":"search"},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const screen = this.props.screen ?? 'search';
    const dark = (this.props.theme ?? 'light') === 'dark';
    const c = dark ? {
      ground: '#0F1110', surface: '#1B1E1D', ink: '#F1F3F1', onInk: '#0F1110', muted: '#A0A8A4', hair: '#2E3331', glass: 'rgba(38,42,40,.92)', kb: '#2A2D2C',
      homeFill: '#D99B2B', homeOn: '#2B1F06', kitchenFill: '#0B7C75', kitchenOn: '#FFFFFF', accentText: '#E9B44C', chipOn: '#F1F3F1', chipOnText: '#0F1110', track: '#30D158', trackOff: '#3A3F3D'
    } : {
      ground: '#F2F3F1', surface: '#FFFFFF', ink: '#1A1F1D', onInk: '#FFFFFF', muted: '#5E6764', hair: '#DFE2DE', glass: 'rgba(255,255,255,.92)', kb: '#D1D4D0',
      homeFill: '#F2B233', homeOn: '#2B1F06', kitchenFill: '#0B7C75', kitchenOn: '#FFFFFF', accentText: '#8A5A00', chipOn: '#1A1F1D', chipOnText: '#FFFFFF', track: '#34C759', trackOff: '#E3E5E2'
    };
    const icons = {
      task: 'M9 11l3 3 8-8M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11',
      note: 'M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5',
      recipe: 'M6 13.9A4 4 0 0 1 7.5 6a5 5 0 0 1 9 0A4 4 0 0 1 18 13.9V20H6zM6 17h12',
      home: 'M3 11l9-8 9 8M5 10v10h14V10',
      grid: 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z',
      plus: 'M12 5v14M5 12h14',
      search: 'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-3.5-3.5',
      gear: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1'
    };
    const line = (i) => (i === 0 ? '0' : '0.5px solid ' + c.hair);
    const chip = (label, active, mark, aria) => ({
      label, mark, aria,
      bg: active ? c.chipOn : c.surface, fg: active ? c.chipOnText : c.ink, border: active ? c.chipOn : c.hair
    });
    const inModule = screen === 'searchModule' || screen === 'searchSheet';
    const filters = inModule ? [
      chip('Taken', true, '✕', 'Module: Taken. Tik om te wijzigen'),
      chip('Wie', false, '▾', 'Filter op wie'),
      chip('Wanneer', false, '▾', 'Filter op wanneer'),
      chip('Status', false, '▾', 'Filter op status')
    ] : [
      chip('Alle modules', false, '▾', 'Module: alle. Tik om te kiezen'),
      chip('Wie', false, '▾', 'Filter op wie'),
      chip('Wanneer', false, '▾', 'Filter op wanneer')
    ];
    const rows = (xs) => xs.map((r, i) => ({ ...r, line: line(i) }));
    const taskGroup = { head: 'TAKEN', showHead: !inModule, fill: c.homeFill, on: c.homeOn, icon: icons.task,
      rows: rows(inModule ? [
        { title: 'Halfvolle melk', meta: 'Boodschappen · open' },
        { title: 'Havermelk voor Sam', meta: 'Thuis · gedaan op zaterdag' }
      ] : [
        { title: 'Halfvolle melk', meta: 'Boodschappen · open' }
      ]) };
    const groups = inModule ? [taskGroup] : [
      taskGroup,
      { head: 'NOTITIES', showHead: true, fill: c.homeFill, on: c.homeOn, icon: icons.note,
        rows: rows([{ title: 'Boodschappen voor oma', meta: 'melk, brood, koffie' }, { title: 'Havermout', meta: 'met melk of water' }]) },
      { head: 'RECEPTEN', showHead: true, fill: c.kitchenFill, on: c.kitchenOn, icon: icons.recipe,
        rows: rows([{ title: 'Pannenkoeken', meta: '500 ml melk' }]) }
    ];
    const tasks = [
      { title: 'Halfvolle melk', meta: 'Boodschappen' },
      { title: 'Vuilnis buiten zetten', meta: '19:00' },
      { title: 'Planten water geven', meta: 'Thuis' },
      { title: 'Verjaardagscadeau Sam', meta: 'Morgen' }
    ].map((t, i) => ({ ...t, line: line(i) }));
    const toggle = (label, on) => ({ label, isToggle: true, isValue: false, on: on ? 'true' : 'false', track: on ? c.track : c.trackOff, knob: on ? 22 : 2 });
    const value = (label, v) => ({ label, isToggle: false, isValue: true, value: v });
    const withLines = (s) => ({ ...s, rows: s.rows.map((r, i) => ({ ...r, line: line(i) })), hasFoot: !!s.foot });
    const sections = (screen === 'settingsTab' ? [
      { head: 'MODULES', rows: [value('Babylog', ''), value('Boodschappen', ''), value('Notities', ''), value('Taken', ''), value('Weekmenu', '')],
        foot: 'Dezelfde pagina’s als het tandwiel rechtsboven in elke module.' }
    ] : [
      { head: 'LIJSTEN', rows: [value('Standaardlijst', 'Thuis'), value('Volgorde', 'Op datum')] },
      { head: 'WEERGAVE', rows: [toggle('Gedane taken tonen', false), toggle('Taken zonder datum in Vandaag', true)] },
      { head: 'HERINNERINGEN', rows: [value('Standaardtijd', '09:00')],
        foot: 'Geldt voor deze telefoon. Lijsten en taken deel je met je groep.' }
    ]).map(withLines);
    const moduleChoices = ['Alle modules', 'Taken', 'Notities', 'Recepten', 'Agenda', 'Klantkaarten'].map((label, i) => ({
      label, line: line(i), selected: label === 'Taken' ? 'true' : 'false', check: label === 'Taken' ? '✓' : ''
    }));
    const tabDefs = [['Home', icons.home], ['Alles', icons.grid], ['Nieuw', icons.plus], ['Zoeken', icons.search], ['Instellingen', icons.gear]];
    const activeTab = screen === 'search' ? 'Zoeken' : screen === 'settingsTab' ? 'Instellingen' : 'Alles';
    const tabs = tabDefs.map(([label, icon]) => ({ label, icon, color: label === activeTab ? c.ink : c.muted }));
    const isSearch = screen === 'search' || inModule;
    const titles = {
      search: 'Zoeken', searchModule: 'Zoeken in Taken', searchSheet: 'Zoeken in Taken',
      moduleRoot: 'Taken', moduleSettings: 'Taken-instellingen', settingsTab: 'Instellingen'
    };
    return {
      c, filters, groups, tasks, sections, moduleChoices, tabs,
      moduleName: 'Taken',
      isSearch, isModule: screen === 'moduleRoot', isSettings: screen === 'moduleSettings' || screen === 'settingsTab',
      showBack: inModule || screen === 'moduleRoot' || screen === 'moduleSettings',
      showSearchBtn: screen === 'moduleRoot', showGear: screen === 'moduleRoot',
      showLargeTitle: true, largeTitle: titles[screen], inlineTitle: '',
      showBar: isSearch, showKeyboard: screen === 'searchModule',
      barBottom: screen === 'searchModule' ? 308 : (screen === 'search' ? 96 : 34),
      showTabs: screen !== 'searchModule' && screen !== 'searchSheet',
      showSheet: screen === 'searchSheet'
    };
  }
}
</script>
</body>
</html>
