<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Richting A of B</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.w{width:198px;height:242px;border-radius:44px;background:#000;color:#F1F3F1;overflow:hidden;position:relative;box-sizing:border-box;padding:12px 10px 8px;display:flex;flex-direction:column;gap:6px;font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;font-size:15px;box-shadow:0 0 0 7px #2A2D2C}
.bar{display:flex;justify-content:space-between;align-items:center;padding:0 12px;font-size:14px;font-weight:600}
.row{background:#1B1E1D;border-radius:14px;min-height:44px;padding:6px 10px;display:flex;gap:8px;align-items:center;box-sizing:border-box}
.t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{display:block;color:#A0A8A4;font-size:12px}
.tile{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none}
.num{font-family:'SF Pro Rounded',ui-rounded,Nunito,system-ui,sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
.ring{width:20px;height:20px;border-radius:50%;border:2px solid #6FD6CD;box-sizing:border-box;flex:none}
.dots{position:absolute;right:5px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px}
.dots i{width:5px;height:5px;border-radius:50%;background:#5A615E;display:block}
.dots i.on{background:#F1F3F1;height:12px;border-radius:3px}
.cap{font-family:-apple-system,system-ui,sans-serif;font-size:13px;color:#5E6764;width:214px;line-height:18px}
.cap b{display:block;color:#1A1F1D;font-weight:600}
</style>
</helmet>
<div style="width:1560px;height:520px;box-sizing:border-box;padding:40px;display:flex;gap:80px;background:#F2F3F1;font-family:-apple-system,system-ui,sans-serif">
  <section style="display:flex;flex-direction:column;gap:24px">
    <h2 style="margin:0;font-size:22px;color:#1A1F1D">A. Modulelijst (gekozen door Eric, 24 nov)</h2>
    <div style="display:flex;gap:28px">
      <figure style="margin:0;display:flex;flex-direction:column;gap:14px">
        <div class="w">
          <div class="bar"><span>Gather</span><span class="num">17:42</span></div>
          <div class="row"><span class="tile" style="background:#0B7C75"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 4h2l2.5 11h11L21 7H6.5"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg></span><span class="t">Boodschappen<span class="sub">7 open</span></span></div>
          <div class="row"><span class="tile" style="background:#D99B2B"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2B1F06" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></span><span class="t">Vandaag<span class="sub">2 afspraken · 3 taken</span></span></div>
          <div class="row"><span class="tile" style="background:#0B7C75"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10v4M10 10v4M13 10v4M16 10v4"/></svg></span><span class="t">Kaarten<span class="sub">5 kaarten</span></span></div>
        </div>
        <figcaption class="cap"><b>Startscherm</b>Elke module een rij met tegel en samenvatting.</figcaption>
      </figure>
      <figure style="margin:0;display:flex;flex-direction:column;gap:14px">
        <div class="w">
          <div class="bar"><span style="color:#6FD6CD">‹ Boodschappen</span><span class="num">17:42</span></div>
          <div class="row"><i class="ring"></i><span class="t">Bananen</span><span class="num" style="color:#A0A8A4;font-size:13px">6</span></div>
          <div class="row"><i class="ring"></i><span class="t">Melk</span><span class="num" style="color:#A0A8A4;font-size:13px">2 pak</span></div>
          <div class="row"><i class="ring"></i><span class="t">Eieren</span></div>
        </div>
        <figcaption class="cap"><b>Module</b>Terug met de knop linksboven.</figcaption>
      </figure>
      <figure style="margin:0;display:flex;flex-direction:column;gap:14px">
        <div class="cap" style="padding-top:8px"><b>Voor en tegen</b>Schaalt naar 10 modules zonder te scrollen per module. Kost een tik extra bij elk gebruik, en de lijst zelf is een scherm dat niets doet.</div>
      </figure>
    </div>
  </section>
  <section style="display:flex;flex-direction:column;gap:24px">
    <h2 style="margin:0;font-size:22px;color:#1A1F1D">B. Verticale pagina's (niet gekozen)</h2>
    <div style="display:flex;gap:28px">
      <figure style="margin:0;display:flex;flex-direction:column;gap:14px">
        <div class="w">
          <div class="bar"><span style="color:#6FD6CD">Boodschappen</span><span class="num">17:42</span></div>
          <div class="row"><i class="ring"></i><span class="t">Bananen</span><span class="num" style="color:#A0A8A4;font-size:13px">6</span></div>
          <div class="row"><i class="ring"></i><span class="t">Melk</span><span class="num" style="color:#A0A8A4;font-size:13px">2 pak</span></div>
          <div class="row"><i class="ring"></i><span class="t">Eieren</span></div>
          <div class="dots" aria-hidden="true"><i class="on"></i><i></i><i></i></div>
        </div>
        <figcaption class="cap"><b>Pagina 1</b>Opent op de laatst gebruikte module.</figcaption>
      </figure>
      <figure style="margin:0;display:flex;flex-direction:column;gap:14px">
        <div class="w">
          <div class="bar"><span style="color:#F2C060">Vandaag</span><span class="num">17:42</span></div>
          <div class="row" style="border-left:0"><span class="t">Tandarts Sem<span class="sub num">18:30</span></span></div>
          <div class="row"><i class="ring" style="border-color:#F2C060"></i><span class="t">Groene bak buiten</span></div>
          <div class="row"><span class="t">Diner: pasta pesto</span></div>
          <div class="dots" aria-hidden="true"><i></i><i class="on"></i><i></i></div>
        </div>
        <figcaption class="cap"><b>Pagina 2</b>Digital Crown of veeg omhoog.</figcaption>
      </figure>
      <figure style="margin:0;display:flex;flex-direction:column;gap:14px">
        <div class="w">
          <div class="bar"><span style="color:#6FD6CD">Kaarten</span><span class="num">17:42</span></div>
          <div class="row"><span class="tile" style="background:#00A0E2"></span><span class="t">Albert Heijn</span></div>
          <div class="row"><span class="tile" style="background:#F28C00"></span><span class="t">GAMMA</span></div>
          <div class="row"><span class="tile" style="background:#1F4FA0"></span><span class="t">Air Miles</span></div>
          <div class="dots" aria-hidden="true"><i></i><i></i><i class="on"></i></div>
        </div>
        <figcaption class="cap"><b>Pagina 3</b>Volgorde volgt de modules op je telefoon.</figcaption>
      </figure>
    </div>
  </section>
</div>
</x-dc>
