<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Basis en staten</title>

</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.w{width:198px;height:242px;border-radius:44px;background:#000;color:#F1F3F1;overflow:hidden;position:relative;box-sizing:border-box;padding:12px 10px 8px;display:flex;flex-direction:column;gap:6px;font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;font-size:15px;box-shadow:0 0 0 7px #2A2D2C}
.bar{display:flex;justify-content:space-between;align-items:center;padding:0 12px;font-size:14px;font-weight:600}
.row{background:#1B1E1D;border-radius:14px;min-height:44px;padding:6px 10px;display:flex;gap:8px;align-items:center;box-sizing:border-box}
.t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{font-family:'SF Pro Rounded',ui-rounded,Nunito,system-ui,sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
.ring{width:20px;height:20px;border-radius:50%;border:2px solid #6FD6CD;box-sizing:border-box;flex:none}
.msg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:0 8px}
.msg p{margin:0;font-size:14px;line-height:19px}
.msg small{color:#A0A8A4;font-size:12px;line-height:16px}
.btn{background:#262A28;color:#F1F3F1;border:0;border-radius:999px;min-height:44px;font:600 15px -apple-system,system-ui,sans-serif;width:100%}
.note{font-size:11px;color:#A0A8A4;text-align:center;display:flex;gap:4px;justify-content:center;align-items:center}
.cap{font-family:-apple-system,system-ui,sans-serif;font-size:13px;color:#5E6764;width:214px;line-height:18px}
.cap b{display:block;color:#1A1F1D;font-weight:600}
</style>
</helmet>
<div style="width:1480px;height:440px;box-sizing:border-box;padding:40px;display:flex;gap:28px;background:#F2F3F1;font-family:-apple-system,system-ui,sans-serif">
  <figure style="margin:0;display:flex;flex-direction:column;gap:14px">

      <div class="row"><span style="width:28px;height:28px;border-radius:9px;background:#D99B2B;display:grid;place-items:center;flex:none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2B1F06" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></span><span class="t">Vandaag<span style="display:block;color:#A0A8A4;font-size:12px">2 afspraken · 3 taken</span></span></div>
      <div class="row"><span style="width:28px;height:28px;border-radius:9px;background:#0B7C75;display:grid;place-items:center;flex:none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10v4M10 10v4M13 10v4M16 10v4"/></svg></span><span class="t">Kaarten<span style="display:block;color:#A0A8A4;font-size:12px">5 kaarten</span></span></div>
    </div>
    <figcaption class="cap"><b>Start: modulelijst</b>Naam van de groep bovenaan. Een rij per module met tegel en samenvatting, in de volgorde van de telefoon. Nieuwe modules komen er als rij bij.</figcaption>
  </figure>
  <figure style="margin:0;display:flex;flex-direction:column;gap:14px">
    <div class="w">
      <div class="bar"><span>Gather</span><span class="num">17:42</span></div>
      <div class="msg">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#F1F3F1" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
        <p>Open Gather op je iPhone</p>
        <small>Dan koppelt je watch vanzelf aan je groep.</small>
      </div>
    </div>
    <figcaption class="cap"><b>Niet gekoppeld</b>Eerste keer of na ontkoppelen. Geen invoer op de watch.</figcaption>
  </figure>
  <figure style="margin:0;display:flex;flex-direction:column;gap:14px">
    <div class="w">
      <div class="bar"><span>Gather</span><span class="num">17:42</span></div>
      <div class="msg">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#6FD6CD" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/></svg>
        <p>Koppelen met Verbeek</p>
        <small>Even geduld, je iPhone stuurt de gegevens.</small>
      </div>
    </div>
    <figcaption class="cap"><b>Koppelen</b>Zodra de iPhone de sleutel stuurt; meestal binnen een paar seconden.</figcaption>
  </figure>
  <figure style="margin:0;display:flex;flex-direction:column;gap:14px">
    <div class="w">
      <div class="bar"><span>Gather</span><span class="num">17:42</span></div>
      <div class="msg">
        <p>Deze watch is ontkoppeld</p>
        <small>Koppel opnieuw in Gather op je iPhone, bij Instellingen › Apple Watch.</small>
      </div>
    </div>
    <figcaption class="cap"><b>Sleutel ingetrokken</b>Na ontkoppelen, uitloggen of uit de groep. De lokale kopie is gewist.</figcaption>
  </figure>
  <figure style="margin:0;display:flex;flex-direction:column;gap:14px">
    <div class="w">
      <div class="bar"><span style="color:#6FD6CD">‹ Boodschappen</span><span class="num">17:42</span></div>
      <div class="row"><i class="ring"></i><span class="t">Eieren</span></div>
      <div class="row"><i class="ring"></i><span class="t">Kaas</span></div>
      <div class="note" style="margin-top:auto"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#A0A8A4" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 2l20 20M8.5 16.5a5 5 0 0 1 7 0M5 12.6a10 10 0 0 1 5.2-2.5M19 12.6a10 10 0 0 0-2-1.5M12 20h.01"/></svg><span>Offline · 3 wijzigingen wachten</span></div>
    </div>
    <figcaption class="cap"><b>Offline</b>Elke module toont de laatste kopie; wijzigingen wachten in de wachtrij.</figcaption>
  </figure>
  <figure style="margin:0;display:flex;flex-direction:column;gap:14px">
    <div class="w">
      <div class="bar"><span>Gather</span><span class="num">17:42</span></div>
      <div class="msg">
        <p>Niet bijgewerkt</p>
        <small>Gather kon de groep niet bereiken. Je ziet de lijst van 17:10.</small>
        <button class="btn" type="button">Opnieuw</button>
      </div>
    </div>
    <figcaption class="cap"><b>Fout</b>Alleen als er geen kopie is; anders de kopie met de offline-regel.</figcaption>
  </figure>
</div>
